apiVersion: apps/v1
kind: Deployment
metadata:
  name: harvis-ai-merged-ollama-backend
  namespace: ai-agents
  labels:
    app.kubernetes.io/name: harvis-ai
    app.kubernetes.io/component: merged-ollama-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: harvis-ai
      app.kubernetes.io/component: merged-ollama-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: harvis-ai
        app.kubernetes.io/component: merged-ollama-backend
    spec:
      runtimeClassName: nvidia
      securityContext:
        fsGroup: 1001   # ensures PVC mounts are writable by appuser (UID 1001) without chown
      nodeSelector:
        kubernetes.io/hostname: dulc3-os    # RTX 5090 — SGLang runs here
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command: ['sh', '-c']
          args:
            - |
              echo "Waiting for PostgreSQL at harvis-ai-pgsql:5432..."
              until nc -z harvis-ai-pgsql 5432; do
                echo "Database not ready yet, retrying in 2s..."
                sleep 2
              done
              echo "✅ PostgreSQL is ready!"
          resources:
            requests:
              memory: 16Mi
              cpu: 10m
            limits:
              memory: 32Mi
              cpu: 50m

      containers:
        # Harvis Backend
        - name: harvis-backend
          image: "dulc3/jarvis-backend:latestv1"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: harvis-ai-backend-secret
                  key: database-url
            - name: OLLAMA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: harvis-ai-backend-secret
                  key: ollama-api-key
            - name: EXTERNAL_OLLAMA_URL
              value: "https://your-ollama.example.com/ollama"
            - name: EXTERNAL_OLLAMA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: harvis-ai-backend-secret
                  key: external-ollama-api-key
                  optional: true
            # Embedding servers on dulc3-top (llama.cpp, CPU-only, OpenAI-compatible)
            - name: OLLAMA_URL
              value: "http://harvis-ai-llama-embed:8081"   # backward compat — points to nomic
            - name: EMBED_NOMIC_URL
              value: "http://harvis-ai-llama-embed:8081"   # nomic-embed-text, 768 dims
            - name: EMBED_QW3_URL
              value: "http://harvis-ai-llama-embed:8082"   # Qwen3-Embedding-4B, 2560 dims
            - name: VLLM_URL
              value: "http://localhost:8080/v1"   # SGLang sidecar (Qwen3.5-27B AWQ on RTX 5090)
            # SGLang co-located sidecar (localhost)
            - name: LLAMA_URL
              value: "http://localhost:8080/v1"
            - name: BACKEND_URL
              value: "http://harvis-ai-merged-backend:8000"
            - name: HF_HOME
              value: "/models-cache/huggingface"
            - name: WHISPER_CACHE
              value: "/models-cache/whisper"
            - name: TMPDIR
              value: "/tmp"
            - name: DISABLE_LOCAL_TTS_WORKERS
              value: "false"  # TTS/Whisper run locally in this pod (moved from separate worker)
            - name: TTS_DEVICE
              value: "cpu"   # Run TTS on CPU (leave GPU for SGLang)
            - name: WHISPER_DEVICE
              value: "cpu"    # Run Whisper on CPU to save GPU memory for LLM
            - name: UVICORN_WORKERS
              value: "1"
            - name: UVICORN_TIMEOUT_KEEP_ALIVE
              value: "120"
          envFrom:
            - configMapRef:
                name: harvis-ai-backend-config
            - secretRef:
                name: harvis-ai-backend-secret
          resources:
            requests:
              memory: 8Gi
              cpu: 1000m
            limits:
              memory: 32Gi
              cpu: 12000m
          volumeMounts:
            - name: embedding
              mountPath: /app/embedding
            - name: tmp
              mountPath: /tmp
            - name: ml-models-cache
              mountPath: /models-cache
            - name: images
              mountPath: /app/images
            - name: artifacts
              mountPath: /data/artifacts
          command: ["uvicorn"]
          args:
            - "main:app"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
            - "--timeout-keep-alive"
            - "120"
            - "--log-level"
            - "info"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

        # SGLang — Qwen3.5-27B AWQ-BF16-INT4 on RTX 5090 (32GB)
        # --mem-fraction-static 0.875: caps VRAM at 28GB (28/32), leaving 4GB headroom
        #   weights ~13.5GB + KV pool ~14.5GB @ fp8_e4m3 → ~116K token context
        # Image: dulc3/sglang-patch — extends dev-cu13 with Bug 4 fix:
        #   compressed_tensors WNA16 Marlin alignment crash for GQA layers
        #   where size_n=48 is not divisible by GPTQ_MARLIN_MIN_THREAD_N=64.
        #   Fix lives in vendor/sglang-H/ — PR pending upstream sglang repo.
        - name: sglang
          image: dulc3/sglang-patch:test2
          imagePullPolicy: Always
          ports:
            - name: sglang
              containerPort: 8080
              protocol: TCP
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: harvis-ai-backend-secret
                  key: hf-token
            - name: HF_HOME
              value: "/models-cache/huggingface"
          command: ["python", "-m", "sglang.launch_server"]
          args:
            - "--model-path"
            - "cyankiwi/Qwen3.5-27B-AWQ-BF16-INT4"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8080"
            - "--served-model-name"
            - "qwen3.5-27b"
            - "--context-length"
            - "262144"
            - "--kv-cache-dtype"
            - "fp8_e4m3"
            - "--reasoning-parser"
            - "qwen3"
            - "--tool-call-parser"
            - "qwen3_coder"
            - "--mem-fraction-static"
            - "0.875"
          volumeMounts:
            - name: ml-models-cache
              mountPath: /models-cache
          resources:
            requests:
              memory: 8Gi
              cpu: 1000m
            limits:
              nvidia.com/gpu: 1
              memory: 30Gi
              cpu: 8000m
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 180    # 27B AWQ model download + load takes time on first run
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /v1/models
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 8

      volumes:
        - name: embedding
          persistentVolumeClaim:
            claimName: harvis-ai-embedding-pvc
        - name: ml-models-cache
          persistentVolumeClaim:
            claimName: ml-models-cache
        - name: tmp
          persistentVolumeClaim:
            claimName: harvis-audio-pvc
        - name: images
          persistentVolumeClaim:
            claimName: harvis-images-pvc
        - name: artifacts
          persistentVolumeClaim:
            claimName: harvis-artifacts-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: harvis-ai-merged-backend
  namespace: ai-agents
  labels:
    app.kubernetes.io/name: harvis-ai
    app.kubernetes.io/component: merged-ollama-backend
spec:
  type: ClusterIP
  ports:
    - name: backend
      port: 8000
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: harvis-ai
    app.kubernetes.io/component: merged-ollama-backend

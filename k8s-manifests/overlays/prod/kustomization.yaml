apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base resources (now local)
resources:
  - ../../base
  - frontend.yaml
  - nginx.yaml
  - merged-ollama-backend.yaml
  # - tts-worker.yaml  # REMOVED: TTS/Whisper now runs in main backend pod
  - document-worker.yaml
  - llama-embed.yaml

# Namespace
namespace: ai-agents

# Image updates
images:
  - name: harvis-backend
    newName: dulc3/jarvis-backend
    newTag: test2
  - name: harvis-frontend
    newName: dulc3/jarvis-frontend
    newTag: test2
  - name: harvis-document-worker
    newName: dulc3/harvis-document-worker
    newTag: test2
  # - name: harvis-tts-worker  # REMOVED: TTS/Whisper now runs in main backend
  #   newName: dulc3/harvis-tts-worker
  #   newTag: unbroken
# Patches for production
patches:
  - target:
      kind: Deployment
      name: harvis-ai-merged-ollama-backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: dulc3/jarvis-backend:test2
  - target:
      kind: Deployment
      name: harvis-ai-frontend
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: dulc3/jarvis-frontend:test2
  - target:
      kind: Deployment
      name: harvis-document-worker
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: dulc3/harvis-document-worker:test2

  # The retired OpenClaw gateway is disabled, including BYO and fallback routing.
  # Gateway-dependent features are unavailable; native Build remains independent.
  # Existing cluster objects are not deleted by apply; the old PV retained data.
  # Inject the gateway token and cloud-provider keys into the backend container
  # (index 0 = harvis-backend). No harvis-ai-openclaw-secret is required any more.
  - target:
      kind: Deployment
      name: harvis-ai-merged-ollama-backend
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: HARVIS_OPENCLAW_DISABLED
          value: "true"
      # The code reads HARVIS_GATEWAY_TOKEN first and falls back to the legacy
      # OPENCLAW_GATEWAY_TOKEN (python_back_end/gateway_token.py), so a cluster that
      # still has the old Secret keeps authenticating. Both are optional: a Secret
      # or key that is missing leaves its variable unset instead of blocking the pod.
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: HARVIS_GATEWAY_TOKEN
          valueFrom:
            secretKeyRef:
              name: harvis-ai-backend-secret
              key: gateway-token
              optional: true
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OPENCLAW_GATEWAY_TOKEN
          valueFrom:
            secretKeyRef:
              name: harvis-ai-openclaw-secret
              key: openclaw-gateway-token
              optional: true
      # MOONSHOT_API_KEY / NVIDIA_API_KEY now come from harvis-ai-backend-secret
      # (keys moonshot-api-key / nvidia-api-key). Both optional: when a key is
      # absent the cloud provider is simply unavailable and the pod still starts.
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: MOONSHOT_API_KEY
          valueFrom:
            secretKeyRef:
              name: harvis-ai-backend-secret
              key: moonshot-api-key
              optional: true
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: MOONSHOT_BASE_URL
          value: "https://api.moonshot.ai/v1"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: NVIDIA_API_KEY
          valueFrom:
            secretKeyRef:
              name: harvis-ai-backend-secret
              key: nvidia-api-key
              optional: true
      # HARVIS_GITHUB_TOKEN / HARVIS_GITHUB_USER / HARVIS_GITHUB_EMAIL removed —
      # GitHub auth is now handled by the HarvisAI GitHub App (App ID 2995570).
      # The harvis-github skill mints short-lived installation tokens at runtime
      # using GH_APP_ID + GH_INSTALLATION_ID + GH_PRIVATE_KEY.

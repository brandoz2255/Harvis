# Two listeners on loopback only; the entrypoint's socat puts each behind a unix
# socket. Nothing else on this container's network can use the proxy.
http_port 127.0.0.1:3128 name=web
http_port 127.0.0.1:3129 name=pkg

acl web_port myportname web
acl pkg_port myportname pkg
acl pkg_sites dstdomain "/etc/squid/packages.txt"
acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT
# A bare IP (dotted, integer, hex or IPv6) is how a scan or a tunnel names its
# target; a box must ask for a host name.
acl ip_literal dstdom_regex -n -i ^[0-9.]+$ ^0x[0-9a-f.x]+$ ^\[?[0-9a-f.]*:[0-9a-f:.]*\]?$
acl blocked_sites dstdomain -n "/etc/squid/blocked.txt"
# Everything that is not the public internet: private, CGNAT (tailnet), loopback,
# link-local (cloud metadata), multicast, reserved. dst matches every address a
# name resolves to, so a public name pointing at the LAN is refused too.
acl not_public dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.168.0.0/16 198.18.0.0/15 224.0.0.0/4 240.0.0.0/4
acl not_public dst ::/128 ::1/128 fc00::/7 fe80::/10 ff00::/8

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny ip_literal
http_access deny blocked_sites
http_access deny not_public
http_access deny to_localhost
http_access allow web_port
http_access allow pkg_port pkg_sites
http_access deny all

# Upload size, written by the entrypoint from its environment. Squid cannot see
# or slow what goes through an HTTPS tunnel; the blocklist is the control there.
include /etc/squid/limits.conf
cache deny all
cache_mem 8 MB
max_filedescriptors 4096
pid_filename none
# squid drops to user proxy before opening these, and can't write the container's
# stdout/stderr; the entrypoint relays two fifos instead (no log file grows on disk).
access_log stdio:/run/squid-log/access.fifo
cache_log stdio:/run/squid-log/cache.fifo
logfile_rotate 0
via off
forwarded_for delete
httpd_suppress_version_string on
shutdown_lifetime 1 seconds

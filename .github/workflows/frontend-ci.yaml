name: Frontend CI

# Checks the UI the product ships (front_end/hermes-desktop-ui): types, the
# unit tests and a production build. Dependencies are installed the same way
# the UI image installs them (front_end/hermes-desktop-ui/Dockerfile), so a
# green run here means the image build has what it needs.

on:
  push:
    branches: [main]
    paths:
      - "front_end/hermes-desktop-ui/**"
      - "front_end/hermes-shared/**"
      - ".github/workflows/frontend-ci.yaml"
  pull_request:
    branches: [main]
    paths:
      - "front_end/hermes-desktop-ui/**"
      - "front_end/hermes-shared/**"
      - ".github/workflows/frontend-ci.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: front_end/hermes-desktop-ui
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: front_end/hermes-desktop-ui/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Type check
        run: npx tsc --noEmit -p .

      - name: Unit tests
        run: npx vitest run --project ui

      - name: Production build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npx vite build

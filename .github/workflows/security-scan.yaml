name: Security Scan 🛡️

# Manual only. The daily schedule was removed: both images below are the old
# stack (the Next.js frontend no longer exists, and the backend image is not the
# one docker-compose.yaml builds), so the run failed every day without saying
# anything about the current code. The repo itself is scanned on every push by
# sast-security-scan.yml.
on:
  workflow_dispatch:

jobs:
  scan-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Install Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: dulc3/jarvis-backend:latest
          format: table
          exit-code: 1
          ignore-unfixed: true

  scan-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Install Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: dulc3/jarvis-frontend:latest
          format: table
          exit-code: 1
          ignore-unfixed: true

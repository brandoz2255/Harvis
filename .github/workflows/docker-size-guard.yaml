name: Docker size guard 📦

# Keeps "fresh clone → working Harvis in one command, under 7 GB" a property of
# the project rather than a cleanup that decays. It builds the DEFAULT service
# set — no profile flags, exactly what `docker compose up -d` starts — and fails
# if the images total more than the budget.
#
# Its own workflow rather than a job on backend-ci.yaml, because that one only
# fires on `python_back_end/**`. The default set's size is also moved by
# docker-compose.yaml, browser_runner/, services/voice-onnx/,
# repo-sandbox-engine/ and front_end/hermes-desktop-ui/, so a compose-only regression would never reach it.

# The two path lists below are identical and have to stay that way. GitHub
# Actions does not support YAML anchors, so they cannot be shared — editing one
# without the other silently leaves half the triggers behind.
on:
  push:
    branches: [main]
    paths:
      - "docker-compose.yaml"
      - "python_back_end/Dockerfile*"
      - "python_back_end/requirements*.txt"
      - "browser_runner/**"
      - "services/voice-onnx/**"
      - "repo-sandbox-engine/**"
      - "front_end/hermes-desktop-ui/Dockerfile"
      - "front_end/hermes-desktop-ui/package*.json"
      - ".github/workflows/docker-size-guard.yaml"
  pull_request:
    paths:
      - "docker-compose.yaml"
      - "python_back_end/Dockerfile*"
      - "python_back_end/requirements*.txt"
      - "browser_runner/**"
      - "services/voice-onnx/**"
      - "repo-sandbox-engine/**"
      - "front_end/hermes-desktop-ui/Dockerfile"
      - "front_end/hermes-desktop-ui/package*.json"
      - ".github/workflows/docker-size-guard.yaml"
  workflow_dispatch:

jobs:
  default-set-size:
    runs-on: ubuntu-latest
    env:
      # Images only. The voice-models volume (~1.1 GB, downloaded at first run,
      # not at build) and the repo checkout (~0.18 GB) are NOT in this number —
      # measured on 2026-07-28 the images were 5.35 GB, so this leaves ~2.1 GB
      # of headroom while the on-disk total sits at ~6.6 GB against the 7 GB
      # product goal.
      LIMIT_GB: "7.5"

    steps:
      - name: ⏬ Checkout code
        uses: actions/checkout@v4

      - name: 💾 Free up disk space
        run: |
          echo "Disk before cleanup:"; df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          echo "Disk after cleanup:"; df -h /

      - name: 🧹 Start from an empty image store
        # This is what makes the measurement honest. GitHub runners ship with
        # several GB of cached images; without this, `docker system df` would be
        # reporting those too. Pruning first means the Images total afterwards is
        # exactly this project's footprint — and it accounts for shared layers,
        # which naively summing `docker images` does not.
        run: |
          docker system prune -af --volumes
          docker system df

      - name: 🔑 Throwaway .env
        # docker-compose.yaml hard-requires JWT_SECRET (${JWT_SECRET:?...}).
        # Nothing here ever runs the stack, so a random value is enough — and it
        # must NOT be a fixed string that could look like a real secret.
        run: |
          printf 'JWT_SECRET=%s\n' "$(openssl rand -hex 32)" > .env
          echo "COMPOSE_PROJECT_NAME=harvis" >> .env

      - name: 📋 The default service set
        # Compose only emits services whose profiles are active, so this list IS
        # the `up -d` set. Printed on every run: if the set itself changes, that
        # shows up here before the size does.
        run: |
          echo "Services a plain 'docker compose up -d' starts:"
          docker compose config --services | sort | sed 's/^/  /'

      - name: 🐳 Build and pull the default set
        env:
          HARVIS_VCS_REF: ${{ github.sha }}
        run: |
          docker compose pull --ignore-buildable
          docker compose build

      - name: 📏 Measure and gate
        run: |
          echo "Per-image table (this is what names a regression's cause):"
          docker images --format '{{.Repository}}:{{.Tag}}\t{{.Size}}' | sort | sed 's/^/  /'
          echo
          docker system df -v | head -30
          echo

          python3 - <<'PY'
          import json, os, subprocess, sys

          # `docker system df` reports real on-disk image bytes with shared layers
          # counted once. Deliberately NOT `docker image inspect .Size` — under the
          # containerd snapshotter that field is unique-layer bytes and has already
          # produced a wrong number once on this project (it reported 5.07 GB for a
          # 15.4 GB image).
          rows = [json.loads(l) for l in subprocess.run(
              ["docker", "system", "df", "--format", "json"],
              capture_output=True, text=True, check=True).stdout.splitlines() if l.strip()]
          images = next(r for r in rows if r.get("Type") == "Images")

          def to_gb(s):
              s = s.split("(")[0].strip()
              for unit, mult in (("TB", 1024), ("GB", 1), ("MB", 1/1024), ("kB", 1/1024**2), ("B", 1/1024**3)):
                  if s.endswith(unit):
                      return float(s[:-len(unit)].strip()) * mult
              raise SystemExit(f"could not parse docker size {s!r}")

          used = to_gb(images["Size"])
          limit = float(os.environ["LIMIT_GB"])

          print(f"default-set images: {used:.2f} GB")
          print(f"budget:             {limit:.2f} GB")
          print(f"headroom:           {limit - used:+.2f} GB")

          if used > limit:
              print()
              print(f"::error::Default-set images are {used:.2f} GB, over the {limit:.2f} GB budget "
                    f"by {used - limit:.2f} GB. The per-image table above says which one grew. "
                    f"Either bring it back down or raise LIMIT_GB deliberately, with a reason.")
              sys.exit(1)
          print()
          print(f"::notice::Default-set images {used:.2f} GB, {limit - used:.2f} GB under budget.")
          PY

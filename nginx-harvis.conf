# Harvis: every location, proxy and header for the front door.
#
# This file is INCLUDED from inside a `server { }` block — once by the plain
# HTTP listener in nginx.conf, and again by the TLS listener in
# nginx/tls/harvis-tls.conf when HTTPS has been turned on. Keeping the routes in
# one file is what stops the two listeners from drifting apart; a route added
# here is served over both without being written twice.
#
# Do not add a `server { }` wrapper here.


    # nginx listens on 80 inside the container but is published on 9000 (or
    # whatever HARVIS_PORT_NGINX says), so its default habit of expanding a
    # relative redirect into an absolute URL emits the WRONG port — it drops
    # 9000 and sends the browser to :80, which nothing is listening on. Every
    # `return 30x /path` in this file (the front door included) depends on this.
    # Relative Location headers are also the right answer behind a TLS
    # terminator or any other reverse proxy.
    absolute_redirect off;

    set $backend_upstream  http://backend:8000;
    set $frontend_upstream http://frontend:3000;
    set $onb_upstream      http://open-notebook-ui:8502;
    set $voice_upstream    http://voice-onnx:8000;
    set $vnc_upstream      http://browser-runner:6080;

    # Local mirror of the Kokoro model the browser loads for speech. Served
    # from the voice service's model volume so in-tab voice works offline
    # after installation; the worker falls back to huggingface.co when this
    # 404s or the service isn't running, so the `voice` profile stays
    # optional. Model files are public and immutable — cache them hard.
    location /kokoro/ {
        # An explicit rewrite, not a URI on proxy_pass: proxy_pass with a
        # variable in it passes the original request URI through untouched,
        # so the path suffix is ignored and the voice service 404s.
        rewrite ^/kokoro/(.*)$ /browser/$1 break;
        proxy_pass $voice_upstream;
        proxy_set_header Host $http_host;
        proxy_intercept_errors off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Serve audio files from temp directory
    location /audio/ {
        alias /tmp/;
        add_header Content-Type application/octet-stream;
        autoindex on;
    }

    # Vibecoding WebSocket terminal (direct to backend)
    location ~ ^/api/vibecoding/container/([^/]+)/terminal$ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # Vibecoding WebSocket terminal (new frontend path)
    location /ws/vibecoding/terminal {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 86400;
    }

    # Signup routes (both the native route and the OWUI facade one) —
    # rate-limited so the X-Setup-Code first-signup gate cannot be
    # brute-forced. Must come before the general auth block below
    # (first matching regex wins).
    location ~ ^/api/(auth/signup|v1/auths/signup)$ {
        limit_req zone=auth_signup burst=5 nodelay;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Setup-Code' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            return 204;
        }

        proxy_hide_header 'Access-Control-Allow-Origin';
        proxy_hide_header 'Access-Control-Allow-Methods';
        proxy_hide_header 'Access-Control-Allow-Headers';
        proxy_hide_header 'Access-Control-Allow-Credentials';

        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Setup-Code' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
    }

    # Auth & History (Specific direct blocks)
    location ~ ^/api/(me|auth/|chat-history/) {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            return 204;
        }

        proxy_hide_header 'Access-Control-Allow-Origin';
        proxy_hide_header 'Access-Control-Allow-Methods';
        proxy_hide_header 'Access-Control-Allow-Headers';
        proxy_hide_header 'Access-Control-Allow-Credentials';

        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
    }

    # Chat & Mic-Chat (Streaming + Keep-Alive)
    location ~ ^/api/(chat|mic-chat) {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            return 204;
        }

        proxy_hide_header 'Access-Control-Allow-Origin';
        proxy_hide_header 'Access-Control-Allow-Methods';
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;

        proxy_read_timeout 3600s;
    }

    # Harvis Workspaces — SSE stream needs buffering disabled
    location ~ ^/api/workspace/stream/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_read_timeout 3600s;
        # Tell upstream Nginx/proxies not to buffer SSE
        add_header X-Accel-Buffering no;
    }

    # Harvis Workspaces — suggest / launch / cancel / status
    location ~ ^/api/workspace/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_read_timeout 300s;
    }

    # Research Endpoints
    location ~ ^/api/(research|research-chat|fact-check|web-search|comparative-research) {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            return 204;
        }

        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

         proxy_pass $backend_upstream;
         proxy_http_version 1.1;
         proxy_set_header Connection "";
         proxy_buffering off;
         proxy_cache off;
         proxy_set_header Host $http_host;
         proxy_set_header X-Real-IP $remote_addr;
         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
         proxy_read_timeout 600s;
    }

    # VibeCode API (Backend)
    location /api/vibecode/ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            return 204;
        }

        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
    }

    # AI SDK (Next.js Side - Streaming endpoint)
    location /api/ai-chat {
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;

        # Critical for streaming: disable buffering and caching
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        proxy_read_timeout 3600s;
    }

    # Notebook SSE streaming (status/stream, podcast generation)
    location ~ ^/api/notebooks/.*/(status/stream|generate-stream) {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 3600s;

        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
    }

    # ── Agent Teammates: the governed computer ───────────────────────────────
    #
    # The Camofox-shaped browser API is for Harvis's own sidecars talking to the
    # backend over the Docker network. Nothing outside should reach it, so the
    # front door answers 404 rather than 403: a 403 confirms the route exists.
    # This is a longer prefix than /api/, so nginx picks it regardless of order.
    location /api/agents/camofox/ {
        return 404;
    }

    # Watch a teammate work, and take the wheel. websockify multiplexes every
    # headed session onto one port inside browser-runner and picks the session
    # from the ?token= query, so one location covers all of them and no new host
    # port is published — the app stays on its single port on Windows, macOS and
    # Linux alike. Same header shape as the vibecoding terminal WebSocket above.
    location /agents/vnc/ {
        # websockify serves noVNC at its own root, so the prefix has to come off
        # before the request leaves. `break` is required here for the same reason
        # it is on the vibecode routes below: $vnc_upstream is a variable, so
        # nginx will not append a URI of its own.
        rewrite ^/agents/vnc/(.*)$ /$1 break;
        proxy_pass $vnc_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # A watched session is idle for long stretches while the agent thinks;
        # a short read timeout would drop the screen mid-run.
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        # VNC framebuffer updates must not sit in a proxy buffer.
        proxy_buffering off;
    }

    # Catch-all for other /api/ calls to backend
    location /api/ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            return 204;
        }

        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # open-notebook browser API calls (/onb/api/*) go STRAIGHT to the backend
    # facade, bypassing the Next.js standalone rewrite-proxy. Next's internal
    # proxy socket-hangs-up (ECONNRESET) on long synchronous chat generations
    # (~30-40s on local Ollama), aborting the browser request even though the
    # backend completes + persists. nginx allows the full 300s here. The rewrite
    # maps /onb/api/<x> -> /onb-api/<x> (same destination Next's rewrite used),
    # and `break` is required because $backend_upstream is a variable.
    location /onb/api/ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            return 204;
        }
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        rewrite ^/onb/api/(.*)$ /onb-api/$1 break;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        client_max_body_size 200M;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Vendored open-notebook UI (Next.js standalone, basePath /onb) served under /onb.
    # Proxy both the exact root and sub-paths (no nginx redirect — Next owns trailing
    # slash, so a redirect here would loop with Next's /onb/ -> /onb).
    location = /onb {
        proxy_pass $onb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
    location /onb/ {
        proxy_pass $onb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
    }

    # open-notebook compat facade (/onb-api). The vendored open-notebook Next
    # server proxies its /api/* here server-side; auth-gated by the Harvis JWT.
    location /onb-api/ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            return 204;
        }
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Hermes UI facade: REST + JSON-RPC WebSocket answered by the Harvis backend
    # (python_back_end/plugins/hermes_ui). The UI is built with
    # VITE_HERMES_API_BASE=/hermes-api so every call lands here.
    location /hermes-api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_read_timeout 86400;
    }

    # Hermes is the Harvis application shell. A user must have a valid Harvis
    # session before the shell loads; otherwise send them through the existing
    # account screen, which creates the same HttpOnly `access_token` cookie that
    # Hermes forwards with every API/WebSocket request.
    #
    # /api/v1/auths/ is the session endpoint (owui_compat/router.py). It depends
    # on get_current_user, which reads the `access_token` cookie BEFORE the
    # Authorization header, and raises a clean 401 when there is no token.
    # Do not point this at a path the backend does not serve: nginx treats any
    # auth_request response that is not 2xx/401/403 as an error and answers 500,
    # so a 404 here turns the whole front door into a blank 500. `nginx -t`
    # cannot catch that — only a live request can.
    location = /_hermes_session_check {
        internal;
        rewrite ^ /api/v1/auths/ break;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
    }

    location @hermes_signin {
        return 302 /auth?redirect=/hermes/;
    }

    # The session check needs a live database to answer 401 rather than throw.
    # When Postgres is down (or the backend is still starting) it raises instead,
    # and without this the front door serves a blank 500 with nothing actionable
    # on it. Say what is wrong and let the browser retry.
    location @hermes_unavailable {
        default_type text/html;
        add_header Retry-After 15 always;
        add_header Cache-Control "no-store" always;
        return 503 '<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Harvis is starting</title><meta http-equiv="refresh" content="15"><style>body{font:16px/1.6 system-ui,sans-serif;max-width:34rem;margin:20vh auto;padding:0 1.5rem;color:#222}h1{font-size:1.25rem}code{background:#f0f0f0;padding:.1em .35em;border-radius:3px}</style></head><body><h1>Harvis is not ready yet</h1><p>The sign-in service could not be reached, so we cannot tell whether you are signed in. This is almost always the database still starting up, or refusing the configured password.</p><p>This page retries every 15 seconds. If it does not clear, check <code>docker compose logs pgsql backend</code>.</p></body></html>';
    }

    # Vendored Hermes desktop UI (front_end/hermes-desktop-ui), built for the
    # browser with base=/hermes/ and served straight off disk. The browser shim
    # points its API calls at this same origin's /hermes-api/, answered by the
    # Harvis backend.
    location = /hermes {
        return 301 /hermes/;
    }

    # Content-hashed chunks: the name changes whenever the bytes do.
    location /hermes/assets/ {
        alias /usr/share/nginx/hermes/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    location /hermes/ {
        auth_request /_hermes_session_check;
        error_page 401 403 = @hermes_signin;
        error_page 500 502 503 504 = @hermes_unavailable;
        alias /usr/share/nginx/hermes/;
        try_files $uri $uri/ /hermes/index.html;
        # The shell NAMES the hashed chunks, so it is revalidated every load for
        # the same reason `location /` is.
        add_header Cache-Control "no-cache" always;
    }

    # Frontend
    # Harvis: serve the OpenWebUI static SPA build (replaces newjfrontend).
    # All /api/* and /ws/* requests still hit the backend via the blocks above;
    # this is the SPA shell only. Fallback to index.html for client-side routes.
    # Content-hashed build output. The filename changes whenever the bytes do, so it is
    # safe to keep forever.
    location /_app/immutable/ {
        root /usr/share/nginx/owui;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    # Keep the account screen and the legacy shell addressable, but land the
    # product at Hermes rather than OpenWebUI.
    location = / {
        return 302 /hermes/;
    }

    location / {
        root /usr/share/nginx/owui;
        try_files $uri $uri/ /index.html;
        # The shell is what NAMES the hashed chunks, so it must be revalidated every load.
        # Without this nginx sends no Cache-Control at all and browsers fall back to
        # heuristic freshness (roughly 10% of the file's age) — which means a browser can
        # keep booting yesterday's shell for hours after a deploy, then ask for chunk
        # hashes the new build deleted. That reads as "the fix didn't work", not as a
        # stale cache, and it has already cost one debugging round.
        add_header Cache-Control "no-cache" always;
    }

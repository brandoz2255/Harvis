version: "3.9"

services:
  # Ollama LLM Service
  ollama:
    image: ollama/ollama:latest
    runtime: nvidia
    container_name: harvis-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
        limits:
          memory: 30G
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:11434/api/tags" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - ollama-n8n-network

  # Model Downloader (Init Container equivalent)
  model-downloader:
    build:
      context: ./python_back_end
      dockerfile: Dockerfile
    container_name: harvis-model-downloader
    user: root
    entrypoint: /bin/bash
    command:
      - -c
      - |
        python3 /app/download_models.py &&
        echo '🔧 Fixing model cache permissions for appuser...' &&
        chown -R 1001:1001 /models-cache &&
        echo '✅ Model cache permissions fixed'
    environment:
      HF_HOME: "/models-cache/huggingface"
      WHISPER_CACHE: "/models-cache/whisper"
      PYTHONUNBUFFERED: "1"
      DOWNLOAD_QWEN_TTS: "true"
      DOWNLOAD_CHATTERBOX_TTS: "false"
    volumes:
      - ml-models-cache:/models-cache
    networks:
      - ollama-n8n-network

  # Artifact Volume Permission Setup
  artifact-init:
    image: busybox:latest
    container_name: harvis-artifact-init
    user: root
    command: >
      sh -c "mkdir -p /data/artifacts && 
             chown -R 1001:1001 /data/artifacts && 
             chmod 750 /data/artifacts &&
             echo 'Artifact permissions initialized'"
    volumes:
      - artifact_data:/data/artifacts
    networks:
      - ollama-n8n-network
    restart: "no"

  # Python FastAPI Backend - Using pre-built image from Docker Hub
  backend:
    image: dulc3/jarvis-backend:v2.29.15
    container_name: harvis-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: "postgresql://pguser:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@pgsql:5432/database"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set in .env}"
      OLLAMA_URL: "http://ollama:11434"
      BACKEND_URL: "http://backend:8000"
      HF_HOME: "/models-cache/huggingface"
      WHISPER_CACHE: "/models-cache/whisper"
      UVICORN_WORKERS: "4"
      ENVIRONMENT: "production"
      LOG_LEVEL: "INFO"
      PYTHONUNBUFFERED: "1"
      ARTIFACT_STORAGE_DIR: "/data/artifacts"
      CODE_EXECUTOR_URL: "http://sandbox:8080"
      # Shared internal bearer for the workspace/tool proxies. The legacy
      # OPENCLAW_GATEWAY_TOKEN name is still read so an existing .env keeps working.
      HARVIS_GATEWAY_TOKEN: "${HARVIS_GATEWAY_TOKEN:-}"
      OPENCLAW_GATEWAY_TOKEN: "${HARVIS_GATEWAY_TOKEN:-${OPENCLAW_GATEWAY_TOKEN:?Set HARVIS_GATEWAY_TOKEN or OPENCLAW_GATEWAY_TOKEN}}"
      # Harvis GitHub bot (harvisai-dulc3-cmd) — injected into workspace directives
      HARVIS_GITHUB_TOKEN: "${HARVIS_GITHUB_TOKEN:-}"
      HARVIS_GITHUB_USER: "${HARVIS_GITHUB_USER:-harvisai-dulc3-cmd}"
      HARVIS_GITHUB_EMAIL: "${HARVIS_GITHUB_EMAIL:-264248399+harvisai-dulc3-cmd@users.noreply.github.com}"
    user: "1001:1001"
    volumes:
      - ml-models-cache:/models-cache
      - embedding-data:/app/embedding
      - /tmp:/tmp
      - artifact_data:/data/artifacts
    depends_on:
      ollama:
        condition: service_started
      pgsql:
        condition: service_healthy
      model-downloader:
        condition: service_completed_successfully
      artifact-init:
        condition: service_completed_successfully
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
        limits:
          memory: 15G
    networks:
      # Same pin as docker-compose.yaml: the highest gw_priority owns the default
      # route, so adding a second network with a gateway later cannot move the
      # backend's traffic to host Ollama and LAN model servers off this one.
      ollama-n8n-network:
        gw_priority: 1
      sandbox-net: {}

  # Next.js Frontend - Using pre-built image from Docker Hub
  frontend:
    image: dulc3/jarvis-frontend:v2.29.15
    container_name: harvis-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: "production"
      NEXT_TELEMETRY_DISABLED: "1"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set in .env}"
      BACKEND_URL: "http://backend:8000"
      OLLAMA_URL: "http://ollama:11434"
    depends_on:
      - backend
      - pgsql
    deploy:
      resources:
        limits:
          memory: 1512M
    networks:
      - ollama-n8n-network

  # Nginx Reverse Proxy
  nginx:
    # Same pin as docker-compose.yaml: nginx-harvis.conf needs add_header_inherit (1.29.3+).
    image: nginx:1.29.6-alpine@sha256:f46cb72c7df02710e693e863a983ac42f6a9579058a59a35f1ae36c9958e4ce0
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx-harvis.conf:/etc/nginx/harvis.conf:ro
    depends_on:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          memory: 64M
    networks:
      - ollama-n8n-network

  # Document Generation Worker
  document-worker:
    build:
      context: ./python_back_end
      dockerfile: Dockerfile.document-worker
    container_name: harvis-document-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://pguser:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@pgsql:5432/database"
      OLLAMA_URL: "http://ollama:11434"
      BACKEND_URL: "http://backend:8000"
      ENVIRONMENT: "production"
      LOG_LEVEL: "INFO"
      PYTHONUNBUFFERED: "1"
      ARTIFACT_STORAGE_DIR: "/data/artifacts"
      WORKER_NAME: "document-worker-docker"
      CODE_EXECUTOR_URL: "http://sandbox:8080"
    user: "1001:1001"
    volumes:
      - artifact_data:/data/artifacts
    depends_on:
      pgsql:
        condition: service_healthy
      backend:
        condition: service_started
      artifact-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          cpus: '0.25'
    networks:
      - ollama-n8n-network
      - sandbox-net
    healthcheck:
      test: [ "CMD-SHELL", "python -c 'import asyncpg; import openpyxl; print(\"healthy\")'" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Document sandbox: runs the Python models write for pptx/docx/xlsx files, away from
  # the backend's secrets. Same service as in docker-compose.yaml; without it document
  # generation fails closed.
  sandbox:
    build:
      context: ./python_back_end
      dockerfile: Dockerfile.sandbox
    image: harvis-sandbox:latest
    container_name: harvis-sandbox
    restart: unless-stopped
    networks:
      - sandbox-net
    environment:
      PYTHONUNBUFFERED: "1"
      HOME: /tmp
    user: "1001:1001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '2.0'
          pids: 256
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # PostgreSQL Database with pgvector
  pgsql:
    image: pgvector/pgvector:pg15
    container_name: pgsql-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pguser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: database
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    volumes:
      - pgsql_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
      - ./python_back_end/artifacts_schema.sql:/docker-entrypoint-initdb.d/artifacts_schema.sql:ro
      - ./python_back_end/artifacts_build_jobs_schema.sql:/docker-entrypoint-initdb.d/artifacts_build_jobs_schema.sql:ro
      - ./front_end/newjfrontend/db/migrations/001_add_document_jobs.sql:/docker-entrypoint-initdb.d/001_add_document_jobs.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - ollama-n8n-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U pguser -d database" ]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  ollama-n8n-network:
    external: true
  # Backend and document-worker to the sandbox, nothing else.
  sandbox-net:
    driver: bridge
    internal: true

volumes:
  ollama-models:
  pgsql_data:
  ml-models-cache:
  embedding-data:
  artifact_data:

events {}

http {
    # MIME types — required now that nginx serves the OWUI static build directly.
    # Without this, .js modules are served as text/plain and the browser refuses
    # them ("Failed to load module script"), leaving the SPA stuck on the splash.
    include /etc/nginx/mime.types;

    # nginx's stock mime.types has no entry for .mjs, so it fell through to
    # default_type and the browser refused the module ("Failed to fetch
    # dynamically imported module"). That is what sent ONNX Runtime's WASM
    # loader to cdn.jsdelivr.net instead of the copy Harvis ships at /wasm/.
    types {
        text/javascript mjs;
    }

    default_type application/octet-stream;

    # Docker DNS. Using variables in proxy_pass forces re-resolution so
    # container IP changes (recreate/rebuild) don't cause stale upstream 502s.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Global proxy timeout settings
    proxy_connect_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
    send_timeout 3600s;
    client_body_timeout 3600s;

    # Allow larger body size for image uploads
    client_max_body_size 50m;

    # Keep-alive settings
    keepalive_timeout 3600s;
    keepalive_requests 1000;

    # Auth brute-force guards, keyed per client IP. Signup protects the
    # first-signup setup code (10 req/min). Sign-in gets its own looser zone
    # (30 req/min) because a lab shares one NAT address across many people.
    # The maps leave the key empty for the other route, and nginx does not
    # count requests with an empty key, so one location can carry both.
    map $uri $auth_signup_key {
        ~/signup$ $binary_remote_addr;
        default   "";
    }
    map $uri $auth_signin_key {
        ~/(signin|login)$ $binary_remote_addr;
        default           "";
    }
    limit_req_zone $auth_signup_key zone=auth_signup:1m rate=10r/m;
    limit_req_zone $auth_signin_key zone=auth_signin:1m rate=30r/m;
    limit_req_status 429;

    # Map allowed origins dynamically
    map $http_origin $cors_origin {
        default "";
        "http://localhost:9000" "$http_origin";
        "http://127.0.0.1:9000" "$http_origin";
        "http://localhost:8000" "$http_origin";
        "http://localhost:3000" "$http_origin";
        "http://localhost:3001" "$http_origin";
        "http://127.0.0.1:8080" "$http_origin";
        "http://127.0.0.1:3000" "$http_origin";
        "http://127.0.0.1:3001" "$http_origin";
        "http://localhost:5173" "$http_origin";
        # HTTPS front door (./scripts/enable-https.sh). The SPA is same-origin so
        # it needs no CORS header at all; these exist for the same reason the
        # http entries do — a separately-served dev frontend talking to this API.
        "https://localhost:9443" "$http_origin";
        "https://127.0.0.1:9443" "$http_origin";
    }

    # NOTE: Repo Runner live previews are served directly from the sandbox
    # container's own localhost-published port (http://localhost:<port>/), not
    # through nginx — each preview is its own origin, so no proxy block here.

    server {
        listen 80;

        # Every route lives in the shared snippet so the TLS listener below
        # serves exactly the same thing. See nginx-harvis.conf.
        include /etc/nginx/harvis.conf;
    }

    # HTTPS listener, if one has been set up.
    #
    # This glob deliberately matches nothing on a stock install, and an include
    # that matches no files is not an error in nginx — so a machine that never
    # ran the TLS setup starts exactly as it always did. `./scripts/enable-https.sh`
    # is what drops a .conf in here (and the cert it points at); until then this
    # line is a no-op.
    include /etc/nginx/tls/*.conf;
}
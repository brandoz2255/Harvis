apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: harvis-ip-pool
  namespace: metallb-system
spec:
  addresses:
  - 10.20.0.200-10.20.0.210  # example range; set your lab network's pool
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: harvis-l2-adv
  namespace: metallb-system
spec:
  ipAddressPools:
  - harvis-ip-pool

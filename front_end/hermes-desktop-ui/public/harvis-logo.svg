<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Harvis mark: a screen with two eyes. Source for harvis-logo.png and
       apple-touch-icon.png (512x512, transparent). To use your own mark,
       replace those two PNGs; nothing else references the artwork. -->
  <defs>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f9bff"/>
      <stop offset="1" stop-color="#3a63e0"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2a55"/>
      <stop offset="1" stop-color="#0e1630"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-40%" width="220%" height="180%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="48" y="64" width="416" height="384" rx="104" fill="url(#bezel)"/>
  <rect x="88" y="104" width="336" height="304" rx="72" fill="url(#screen)"/>
  <g fill="#9dbcff" filter="url(#glow)">
    <rect x="170" y="200" width="48" height="112" rx="24"/>
    <rect x="294" y="200" width="48" height="112" rx="24"/>
  </g>
</svg>

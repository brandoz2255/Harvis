# Pin the compose project name so `docker compose up -d` from ANY checkout
# (main or a git worktree) targets the SAME containers, networks, and — the
# critical part — the same `harvis_*` named data volumes. Without this, running
# from a worktree would silently create a parallel empty stack (fresh DB).
#
# A top-level `name:` outranks $COMPOSE_PROJECT_NAME, which is exactly what
# makes the pin work — so a SECOND, deliberately separate stack (a test rig
# beside a real install) overrides it here instead, together with
# $HARVIS_CONTAINER_PREFIX below. Both default to today's values, so an
# ordinary install is byte-for-byte what it always was.
#
# Namespacing the NAMES is only half of it: two stacks on one host also need
# different published PORTS, or the second one cannot bind and never starts.
# Every host-published port below is therefore overridable, each defaulting to
# the port it has always used:
#
#   HARVIS_PORT_BACKEND       8000   backend API
#   HARVIS_PORT_NGINX         9000   nginx front door (container :80)
#   HARVIS_PORT_POSTGRES      5432   pgsql
#   HARVIS_PORT_MCP           8010   harvis-mcp        (loopback only)
#   HARVIS_PORT_FRONTEND      3000   frontend          (profile: legacy)
#   HARVIS_PORT_OPENCLAW     18789   openclaw gateway  (loopback; profile: engines)
#   HARVIS_PORT_TTS           8001   tts-service       (profile: advanced-voice)
#   HARVIS_PORT_NOTEBOOK_UI   8502   open-notebook UI  (profile: notebooks-upstream)
#   HARVIS_PORT_NOTEBOOK_API  5055   open-notebook API (profile: notebooks-upstream)
#   HARVIS_PORT_MESSAGING    18800   messaging gateway (profile: messaging)
#
# Container-internal ports are NOT parameterised — only the host side moves, so
# every in-container URL and healthcheck keeps working untouched.
name: ${HARVIS_STACK_NAME:-harvis}

services:
  # Cookbook hardware scanner for the MAIN HOST. llmfit scans this box's
  # GPU/CPU/RAM and serves a fit-ranked model DB that the backend's
  # /api/cookbook/* proxies. GPU-passthrough so it detects the real card
  # instead of CPU-only. Subhosts (e.g. the rig) run their own `llmfit serve`;
  # this container is the "main-host" cookbook node (reached by the backend as
  # http://llmfit:8787 on the shared network).
  #
  # Default, not profiled. It used to be profile-gated because `runtime: nvidia`
  # made it the one service that cannot start without the NVIDIA container
  # runtime — the same failure the `backend` service hit (see its comment below).
  # That premise was wrong: measured 2026-07-28, llmfit 0.9.30 under plain runc
  # starts, serves, enumerates hardware off the PCI bus, and ranks its catalogue
  # — on a GPU box it found an AMD iGPU and an NVIDIA card with no passthrough at
  # all, and on a GPU-less QEMU VM it reported CPU/RAM and still ranked 3,195
  # models. GPU passthrough only sharpens the reading (CUDA VRAM comes back null
  # without it), so it is now opt-in via HARVIS_GPU_RUNTIME rather than a hard
  # requirement that costs every CPU host the whole cookbook.
  #
  # On a host with the NVIDIA container runtime, install.sh writes
  # HARVIS_GPU_RUNTIME=nvidia into .env; NVIDIA_VISIBLE_DEVICES below then
  # exposes the card. Anywhere else it stays `runc` and llmfit reads what it can.
  # Deliberately no `deploy.resources.reservations.devices` block: a device
  # reservation naming the nvidia driver fails at container-create on a host
  # without it, which is precisely the portability trap being removed here.
  llmfit:
    # Pinned. `latest` on an upstream we do not control means a `docker compose
    # pull` can swap the cookbook backend under a working install with no diff
    # to point at. 0.9.30 is what this integration was written against.
    image: ghcr.io/alexsjones/llmfit:0.9.30@sha256:465a5197257a3d34a22a52b1e4ea5aecefc1973788c0f6a0a8fd5a4f93c7f93c
    runtime: ${HARVIS_GPU_RUNTIME:-runc}
    container_name: ${HARVIS_CONTAINER_PREFIX:-}harvis-llmfit
    restart: unless-stopped
    command: ["serve", "--host", "0.0.0.0", "--port", "8787"]
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: utility,compute
    networks:
      - ollama-n8n-network

  # Model Downloader (Init Container equivalent)
  model-downloader:
    build:
      context: ./python_back_end
      dockerfile: Dockerfile
      args:
        # Stamped into org.opencontainers.image.revision. Unset locally, so a
        # developer build is honestly labelled "unknown" rather than carrying a
        # stale sha; CI exports HARVIS_VCS_REF and gets the real one.
        VCS_REF: ${HARVIS_VCS_REF:-unknown}
    container_name: ${HARVIS_CONTAINER_PREFIX:-}harvis-model-downloader
    # Downloads the torch-side weights — Whisper, Chatterbox, Qwen3-TTS — for
    # the in-process/RVC voice path. The ONNX Voice-First preset needs none of
    # them (voice-onnx fetches its own ONNX bundles into its model volume), so
    # this rides `advanced-voice` and a `--profile voice` install stays clear of
    # the multi-GB pull.
    profiles: ["advanced-voice"]
    user: root
    entrypoint: /bin/bash
    command:
      - -c
      - |
        python3 /app/download_models.py &&
        echo 'Fixing model cache permissions for appuser...' &&
        chown -R 1001:1001 /models-cache &&
        echo 'Model cache permissions fixed'
    environment:
      # One cache root — see the longer note on the backend service. This is the
      # writer that filled the volume, so it is the one that was creating both
      # huggingface/hub/models--* and huggingface/models--* for the same repo.
      HF_HOME: "/models-cache/huggingface"
      WHISPER_CACHE: "/models-cache/whisper"
      PYTHONUNBUFFERED: "1"
      # TTS Model Download Configuration
      # Set to "false" to skip downloading that model (saves disk space)
      DOWNLOAD_QWEN_TTS: "true"
      DOWNLOAD_CHATTERBOX_TTS: "false"
    volumes:
      - ml-models-cache:/models-cache
    networks:
      - ollama-n8n-network

  # Artifact Volume Permission Setup (runs as root to set proper permissions)
  artifact-init:
    image: busybox:1.37.0@sha256:b3255e7dfbcd10cb367af0d409747d511aeb66dfac98cf30e97e87e4207dd76f
    container_name: ${HARVIS_CONTAINER_PREFIX:-}harvis-artifact-init
    user: root
    command: >
      sh -c "mkdir -p /data/artifacts &&
             chown -R 1001:1001 /data/artifacts &&
             chmod 750 /data/artifacts &&
             echo 'Artifact permissions initialized'"
    volumes:
      - artifact_data:/data/artifacts
    networks:
      - ollama-n8n-network
    restart: "no"

  # Python FastAPI Backend
  backend:
    # Dockerfile.core, not Dockerfile: python:3.12-slim instead of the 12.1 GB
    # pytorch/cuda base — 2.42 GB instead of 15.4 GB. The API never needed torch.
    # model_manager.py guards `import torch` behind a null-object shim and main.py
    # imports torch *from* it, so every torch.cuda.* call still resolves. The heavy
    # engines are separate services now (voice-onnx by default, tts-service under
    # --profile advanced-voice).
    #
    # `runtime: nvidia` went with it. It failed every fresh install on a host
    # without the NVIDIA container runtime, for a container that no longer holds
    # a line of CUDA code.
    build:
      context: ./python_back_end
      dockerfile: Dockerfile.core
      args:
        # Stamped into org.opencontainers.image.revision. Unset locally, so a
        # developer build is honestly labelled "unknown" rather than carrying a
        # stale sha; CI exports HARVIS_VCS_REF and gets the real one.
        VCS_REF: ${HARVIS_VCS_REF:-unknown}
    container_name: ${HARVIS_CONTAINER_PREFIX:-}harvis-backend
    restart: unless-stopped
    # The GID that owns /var/run/docker.sock on the HOST. appuser (1001) is not
    # in it by default, and without this the socket mount below is present but
    # unreadable.
    #
    # This was hardcoded to 984 — the docker group on ONE developer's machine.
    # Debian and Ubuntu usually land on 998 or 999, Fedora on 1001, and Docker
    # Desktop presents it as 0. So on every other host the backend came up
    # healthy with a socket it could not open, and the four features that need
    # it (isolated runner, repo sandboxes, vibecode containers, integrations
    # status) reported "docker client unavailable" with nothing obviously wrong.
    #
    # install.sh reads the real GID off the socket and writes HARVIS_DOCKER_GID
    # into .env. 984 stays the fallback so existing installs are unaffected.
    #     stat -c '%g' /var/run/docker.sock
    group_add:
      - "${HARVIS_DOCKER_GID:-984}"
    ports:
      # Backend API. Bound to the host loopback by default: the browser never
      # talks to it directly (nginx on :9000 proxies /api/), and containers
      # reach it as http://backend:8000 over the Docker network. Set
      # HARVIS_BIND_ADDR=0.0.0.0 in .env only if you need it from another machine.
      - "${HARVIS_BIND_ADDR:-127.0.0.1}:${HARVIS_PORT_BACKEND:-8000}:8000"
    environment:
      DATABASE_URL: "postgresql://pguser:${POSTGRES_PASSWORD:-pgpassword}@pgsql:5432/database"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set in .env}"
      # Let PyTorch reuse fragmented/reserved VRAM instead of OOMing on the
      # TTS generation's ~774MB activation alloc. Critical on the 8GB laptop GPU
      # where Whisper + TTS + desktop fragment the small free pool. (The CUDA-OOM
      # error itself recommends this.) Harmless on the rig.
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      OLLAMA_URL: "${HARVIS_LLM_BASE_URL:-${OLLAMA_URL:-http://host.docker.internal:11434}}"
      # Which optional capability packs the operator turned on. A container cannot
      # see `docker compose --profile`, so without this the health endpoints have
      # no way to tell "engines were never installed" from "openclaw crashed", and
      # a correct default install reports itself degraded.
      HARVIS_ENABLED_PROFILES: "${COMPOSE_PROFILES:-}"
      # Workspace task-detector model. Without this the resolver auto-picks the
      # LARGEST installed model (e.g. gpt-oss:20b) which can't load in 15s on the
      # 8GB GPU → detection times out → chat builds never launch. Pin a SMALL/fast
      # model that fits the GPU alongside the chat model (qwen3:4b ≈ 2.5GB) so
      # detection never evicts/thrashes the heavier chat model on the 8GB laptop.
      # Use a NON-thinking model: qwen3:4b emits a long <think> chain (~13s, ignores
      # think:false) → 15s timeout on the 8GB GPU → detection silently fails → no workspace
      # card. llama3.1:8b is non-thinking and with format:json answers in ~3s.
      #
      # EMPTY BY DEFAULT — deliberately. Pinning a name here is a hard override that
      # BYPASSES the adaptive resolver (task_detector._resolve_detector_model), so a
      # fresh clone that never pulled that exact tag gets silent detection failure and
      # no Build card at all. Empty lets the resolver pick whatever Ollama actually has.
      # Set it in .env on a box where you know the tag is pulled and want it pinned;
      # the detector now verifies a pin against /api/tags and falls back if it's absent.
      WORKSPACE_DETECTOR_OLLAMA_MODEL: "${WORKSPACE_DETECTOR_OLLAMA_MODEL:-}"
      # Optional desktop-GPU Ollama for the model picker. Surfaces models that
      # only exist on the desktop (e.g. gemma4-26b on the 5080) in /api/models.
      DESKTOP_OLLAMA_URL: "${DESKTOP_OLLAMA_URL:-}"
      # Inference nodes — OpenAI-dialect servers (FreeToken, vLLM, llama-server) on this
      # box or another, checked before Ollama for the models they report. Empty = inert.
      # Format and the thinking policy: docs/inference-nodes.md
      HARVIS_INFERENCE_NODES: "${HARVIS_INFERENCE_NODES:-}"
      HARVIS_NODE_THINKING: "${HARVIS_NODE_THINKING:-auto}"
      # Deep-research synthesis model. MUST be forwarded here or a .env override
      # never reaches the container (the code default would always win). Empty =
      # fall back to the code default (llama3.1:8b); set in .env to an installed
      # model. Per-request body.model overrides this.
      DEEP_RESEARCH_MODEL: "${DEEP_RESEARCH_MODEL:-}"
      # Operator-wide default local model, used by plugins.models.resolver whenever
      # the user has no saved pick. Same forwarding rule as DEEP_RESEARCH_MODEL: it
      # was read by the code but never declared here, so setting it in .env did
      # nothing. Empty = resolver uses the first model Ollama actually reports.
      HARVIS_DEFAULT_LOCAL_MODEL: "${HARVIS_DEFAULT_LOCAL_MODEL:-}"
      # Safety net for OpenClaw's `model=auto` when the saved pick can't be served.
      # Empty = the resolver names a real installed model instead of a fixed guess.
      HARVIS_AUTO_MODEL_FALLBACK: "${HARVIS_AUTO_MODEL_FALLBACK:-}"
      # Per-workspace ephemeral Docker terminal (Phase 2). Default ON — the
      # backend probes docker.sock + network at startup and gates the
      # /api/tools/terminal/<wsid>/exec endpoint on the result. Set
      # HARVIS_TERMINAL_ENABLED=false to force-disable as a kill-switch.
      HARVIS_TERMINAL_ENABLED: "${HARVIS_TERMINAL_ENABLED:-true}"
      HARVIS_TERMINAL_IMAGE: "${HARVIS_TERMINAL_IMAGE:-ubuntu:24.04}"
      HARVIS_TERMINAL_NETWORK: "${HARVIS_TERMINAL_NETWORK:-harvis_openclaw-internal}"
      HARVIS_TERMINAL_MEM: "${HARVIS_TERMINAL_MEM:-512m}"
      HARVIS_TERMINAL_CPUS: "${HARVIS_TERMINAL_CPUS:-1.0}"
      HARVIS_TERMINAL_DEFAULT_TIMEOUT_S: "${HARVIS_TERMINAL_DEFAULT_TIMEOUT_S:-30}"
      HARVIS_TERMINAL_MAX_TIMEOUT_S: "${HARVIS_TERMINAL_MAX_TIMEOUT_S:-600}"
      HARVIS_TERMINAL_IDLE_TIMEOUT_S: "${HARVIS_TERMINAL_IDLE_TIMEOUT_S:-1800}"
      # Phase 4 SSH target registry (lane 5). Default OFF — every /api/remote/ssh
      # route 403s until HARVIS_SSH_ENABLED is truthy AND a host is fingerprint-
      # trusted. State dir holds per-user known_hosts (0700) + ephemeral 0600 key
      # files; it rides the ssh_state named volume (see volumes: below). Optionally
      # pass SSH_AUTH_SOCK through for 'agent' auth (the socket must ALSO be mounted
      # into the container for agent auth to actually work).
      HARVIS_SSH_ENABLED: "${HARVIS_SSH_ENABLED:-false}"
      HARVIS_SSH_STATE_DIR: "/data/ssh_state"
      SSH_AUTH_SOCK: "${SSH_AUTH_SOCK:-}"
      # Automations: the cron tick loop fires scheduled agent runs when true.
      HARVIS_CRON_ENABLED: "${HARVIS_CRON_ENABLED:-true}"
      # ── VOICE, OUT OF THE BOX ─────────────────────────────────────────────
      # Speech points at the voice-onnx sidecar by DEFAULT. It has to: `local`
      # means in-process Whisper and Piper, and this image is built from
      # Dockerfile.core, which carries neither torch nor piper. A `local`
      # default here would leave a voice-first product with no voice — the
      # providers do report that honestly instead of crashing, but "helpful
      # error message" is not the shipped experience.
      #
      # voice-onnx is ~1 GB of image plus ~630 MB of ONNX models in a volume,
      # with no PyTorch and no CUDA. It starts with the default set.
      #
      # Browser Kokoro stays the preferred path for ordinary chat playback and
      # needs no provider setting; voice-onnx also mirrors its weights so that
      # path works offline.
      #
      # The torch-bearing alternatives live behind profiles so nothing drags
      # them in by accident:
      #     advanced-voice   tts-service (RVC, ~20 GB) + model-downloader
      #     voice-fallback   stt (Speaches) — the ONNX benchmark's reference
      # ──────────────────────────────────────────────────────────────────────
      # Speech-to-text provider (python_back_end/transcription.py). Declared here
      # or a .env setting never reaches the container — the same forwarding trap
      # DEEP_RESEARCH_MODEL hit. Values:
      #   sidecar  any OpenAI-compatible /audio/transcriptions endpoint (default):
      #            HARVIS_STT_URL=http://voice-onnx:8000/v1   (the default set)
      #            HARVIS_STT_URL=http://stt:8000/v1  (--profile voice-fallback)
      #   local    in-process Whisper — needs torch, which Dockerfile.core omits
      #   browser  the client transcribes; the server refuses audio uploads (503)
      #   disabled no speech input at all
      HARVIS_STT_PROVIDER: "${HARVIS_STT_PROVIDER:-sidecar}"
      HARVIS_STT_URL: "${HARVIS_STT_URL:-http://voice-onnx:8000/v1}"
      HARVIS_STT_MODEL: "${HARVIS_STT_MODEL:-}"
      HARVIS_STT_API_KEY: "${HARVIS_STT_API_KEY:-}"
      HARVIS_STT_LANGUAGE: "${HARVIS_STT_LANGUAGE:-}"
      # Text-to-speech provider (python_back_end/synthesis.py). Same four values,
      # same reason they are declared here rather than left to .env:
      #   sidecar  OpenAI-compatible /audio/speech, e.g. the ONNX voice service
      #            (default): HARVIS_TTS_URL=http://voice-onnx:8000/v1
      #   local    in-process Piper — not installed in Dockerfile.core
      #   browser  the client speaks (browser Kokoro); the server refuses (503)
      #   disabled no speech output at all
      HARVIS_TTS_PROVIDER: "${HARVIS_TTS_PROVIDER:-sidecar}"
      HARVIS_TTS_URL: "${HARVIS_TTS_URL:-http://voice-onnx:8000/v1}"
      HARVIS_TTS_MODEL: "${HARVIS_TTS_MODEL:-}"
      HARVIS_TTS_VOICE: "${HARVIS_TTS_VOICE:-af_heart}"
      HARVIS_TTS_SPEED: "${HARVIS_TTS_SPEED:-1.0}"
      HARVIS_TTS_FORMAT: "${HARVIS_TTS_FORMAT:-wav}"
      HARVIS_TTS_API_KEY: "${HARVIS_TTS_API_KEY:-}"
      BACKEND_URL: "http://backend:8000"
      # HF_HOME is the only cache root, on purpose. Setting TRANSFORMERS_CACHE
      # alongside it looks redundant and is actually a duplicator: HF_HOME means
      # "$HF_HOME/hub/models--<repo>", TRANSFORMERS_CACHE means
      # "$TRANSFORMERS_CACHE/models--<repo>" with no hub/ level. Point both at
      # the same directory and each library writes to a DIFFERENT subtree of it,
      # so the same repo lands twice. Measured on this dev box before removing
      # it: Qwen3-TTS-0.6B cached at both huggingface/hub/models--… (651 MB) and
      # huggingface/models--… (2.3 GB), same for all-MiniLM-L6-v2.
      # TRANSFORMERS_CACHE is also deprecated upstream (warns since transformers
      # 4.36, gone in v5), so there is nothing to keep it for.
      #
      # Existing installs: the orphaned top-level huggingface/models--* dirs are
      # not deleted by this change — nothing reads them any more, and anything
      # still needed re-downloads under hub/. Reclaim manually when convenient.
      HF_HOME: "/models-cache/huggingface"
      WHISPER_CACHE: "/models-cache/whisper"
      UVICORN_WORKERS: "1"
      ENVIRONMENT: "production"
      LOG_LEVEL: "INFO"
      PYTHONUNBUFFERED: "1"
      ARTIFACT_STORAGE_DIR: "/data/artifacts"
      # Notebook source storage. Must live UNDER /data/artifacts — that subtree is
      # owned by appuser(1001), whereas /data itself is root-owned and not writable,
      # so the default /data/notebooks fails makedirs with EACCES.
      NOTEBOOK_STORAGE_PATH: "/data/artifacts/notebooks"
      # For Docker Compose, run code locally (not in separate containers)
      # This avoids needing Docker socket access
      CODE_EXECUTOR_LOCAL: "true"
      # OpenClaw integration
      # OPENCLAW_URL / OPENCLAW_BUNDLED_URL default to the local container.
      # Override in .env to route to a remote gateway (e.g. desktop GPU box).
      # If primary fails, the client auto-retries against OPENCLAW_FALLBACK_URL.
      OPENCLAW_URL: "${OPENCLAW_URL:-ws://openclaw:18789}"
      OPENCLAW_GATEWAY_TOKEN: "${OPENCLAW_GATEWAY_TOKEN_BUNDLED:-${OPENCLAW_GATEWAY_TOKEN}}"
      OPENCLAW_GATEWAY_TOKEN_BUNDLED: "${OPENCLAW_GATEWAY_TOKEN_BUNDLED:-${OPENCLAW_GATEWAY_TOKEN}}"
      OPENCLAW_BUNDLED_URL: "${OPENCLAW_BUNDLED_URL:-ws://openclaw:18789}"
      OPENCLAW_FALLBACK_URL: "${OPENCLAW_FALLBACK_URL:-ws://openclaw:18789}"
      OPENCLAW_FALLBACK_TOKEN: "${OPENCLAW_FALLBACK_TOKEN:-${OPENCLAW_GATEWAY_TOKEN_BUNDLED:-${OPENCLAW_GATEWAY_TOKEN}}}"
      # Host-installed OpenClaw gateway (Discord-facing, runs on host:18790)
      OPENCLAW_HOST_URL: "${OPENCLAW_HOST_URL:-ws://host.docker.internal:18790}"
      # Path inside the container to the host's native OpenClaw config
      # (bind-mounted below). Used by /model Discord command to propagate
      # model selection to the native BYO OpenClaw gateway.
      HOST_OPENCLAW_CONFIG: "${HOST_OPENCLAW_CONFIG:-/host-openclaw/openclaw.json}"
      # Engine sync (Agent Studio → Skills → Engine sync). ONE published SKILL.md
      # tree, written here by the backend and mounted read-only into every engine
      # sidecar at /skills — a verified skill should reach whichever engine runs
      # the task, not just OpenClaw. Gated by HARVIS_ENGINE_SYNC; nothing is ever
      # written without an explicit apply from the UI.
      HARVIS_ENGINE_SKILLS_DIR: "${HARVIS_ENGINE_SKILLS_DIR:-/app/engine_skills}"
      HARVIS_ENGINE_SYNC: "${HARVIS_ENGINE_SYNC:-${HARVIS_OPENCLAW_SYNC:-0}}"
      # Cloud AI providers (loaded from .env — never hardcode here)
      MOONSHOT_API_KEY: "${MOONSHOT_API_KEY:-}"
      MOONSHOT_BASE_URL: "${MOONSHOT_BASE_URL:-https://api.moonshot.ai/v1}"
      NVIDIA_API_KEY: "${NVIDIA_API_KEY:-}"
      # Discord → Workspace bridge (backend-owned Discord bot)
      DISCORD_BOT_TOKEN: "${DISCORD_BOT_TOKEN:-}"
      DISCORD_WORKSPACE_ENABLED: "${DISCORD_WORKSPACE_ENABLED:-true}"
      # Phase 1D cutover toggle — flip to "false" once harvis-messaging-gateway
      # is handling Discord, to avoid duplicate replies.
      DISCORD_WORKSPACE_BOT_LEGACY_ENABLED: "${DISCORD_WORKSPACE_BOT_LEGACY_ENABLED:-true}"
      DISCORD_DEFAULT_USER_ID: "${DISCORD_DEFAULT_USER_ID:-2}"
      DISCORD_MENTION_ONLY: "${DISCORD_MENTION_ONLY:-true}"
      DISCORD_ALLOWED_CHANNEL_IDS: "${DISCORD_ALLOWED_CHANNEL_IDS:-}"
      DISCORD_WORKSPACE_AGENT_ID: "${DISCORD_WORKSPACE_AGENT_ID:-main}"
      DISCORD_WORKSPACE_MODEL_NAME: "${DISCORD_WORKSPACE_MODEL_NAME:-}"
      DISCORD_WORKSPACE_MAX_WAIT_SECONDS: "${DISCORD_WORKSPACE_MAX_WAIT_SECONDS:-900}"
      DISCORD_WORKSPACE_ENABLE_INTERACTIVE: "${DISCORD_WORKSPACE_ENABLE_INTERACTIVE:-false}"
      # Discord channel IDs for heartbeat/alerts proxy
      DISCORD_HEARTBEAT_CHANNEL_ID: "${DISCORD_HEARTBEAT_CHANNEL_ID:-}"
      DISCORD_ALERTS_CHANNEL_ID: "${DISCORD_ALERTS_CHANNEL_ID:-}"
      DISCORD_GENERAL_CHANNEL_ID: "${DISCORD_GENERAL_CHANNEL_ID:-}"
      # Build Space Phase 6 — Discord #harvis-code coding channel. DORMANT unless
      # HARVIS_CODE_CHANNEL_ID is set. Approvals: anyone in the channel (no role gate).
      HARVIS_CODE_CHANNEL_ID: "${HARVIS_CODE_CHANNEL_ID:-1526412856990502923}"
      HARVIS_CODE_GUILD_ID: "${HARVIS_CODE_GUILD_ID:-1491563310699516044}"
      HARVIS_CODE_APPROVER_ROLE_IDS: "${HARVIS_CODE_APPROVER_ROLE_IDS:-}"
      # Workspace routing — send most messages through OpenClaw
      DISCORD_PREFER_WORKSPACE: "${DISCORD_PREFER_WORKSPACE:-true}"
      # History turns — 0 prevents prior chat history from bleeding into
      # tool-dependent workspace tasks (hash cracking, decode, etc.).
      # OpenClaw maintains its own per-session context for continuity.
      DISCORD_WORKSPACE_HISTORY_TURNS: "${DISCORD_WORKSPACE_HISTORY_TURNS:-0}"
      # Messaging gateway sidecar — service-to-service shared secret
      MESSAGING_GATEWAY_TOKEN: "${MESSAGING_GATEWAY_TOKEN:-}"
      HARVIS_PUBLIC_URL: "${HARVIS_PUBLIC_URL:-}"
      # Shared projects volume path inside backend container
      OPENCLAW_PROJECTS_DIR: "/data/openclaw-projects"
      # Real local repos bind-mounted READ-ONLY for orchestrated clone-local "attached" runs
      # (comma-separated container paths). The agent only ever clones FROM these.
      # Phase E1 — external code engines (OpenCode/Codex/Claude Code sidecars). Default ON so
      # a verified Claude/OpenAI credential makes those Build engines runnable (the picker
      # already lists their models); still overridable via the env var.
      HARVIS_OWUI_EXTERNAL_ENGINES: "${HARVIS_OWUI_EXTERNAL_ENGINES:-true}"
      # OPTIONAL first-signup gate, empty by default: the first account claims
      # admin with no code. Set this in .env only when an UNCLAIMED instance is
      # reachable from a network you don't trust — then the first signup must
      # send it in the X-Setup-Code header. Never hard-code it here.
      HARVIS_SETUP_CODE: "${HARVIS_SETUP_CODE:-}"
      # Server-enforced (main.py signup gate) AND read by the frontend config.
      # Default ON so a fresh deploy has a working "Don't have an account?
      # Sign up" front door. Set false for a closed, invite-only instance —
      # worth doing on anything internet-facing, since this is what lets
      # strangers self-register ordinary accounts.
      HARVIS_OWUI_ENABLE_SIGNUP: "${HARVIS_OWUI_ENABLE_SIGNUP:-true}"
      # Set true behind HTTPS so the auth cookie gets the Secure flag.
      # Leave false for localhost / plain HTTP LAN installs.
      HARVIS_COOKIE_SECURE: "${HARVIS_COOKIE_SECURE:-false}"
      # Adaptive Workspace CAD engine (Stage 2). OFF by default — a gated capability.
      # Set HARVIS_ADAPTIVE_CAD_ENABLED=true and bring up the cad-engine sidecar to activate.
      HARVIS_ADAPTIVE_CAD_ENABLED: "${HARVIS_ADAPTIVE_CAD_ENABLED:-}"
      HARVIS_ADAPTIVE_CAD_URL: "${HARVIS_ADAPTIVE_CAD_URL:-http://harvis-cad:8000}"
      # HE-0…HE-10 evidence tranche: semantic face-role targets, targeted
      # measurements, and conformance graded on those numbers. Default OFF —
      # off means the pre-HE path runs unchanged (regex/v1 checks, no
      # measurements requested or stored). The backend process is what reads
      # this: the CAD tools run HERE, over MCP, not inside the model sidecar,
      # so setting it anywhere else has no effect on an authored part.
      HARVIS_CAD_EVIDENCE_V2: "${HARVIS_CAD_EVIDENCE_V2:-false}"
      # Adaptive Workspace Repo Runner — clone + run an untrusted repo in an isolated,
      # cap-dropped sandbox on the repo-sandbox network. Flag default OFF (untrusted code).
      # Build the polyglot image: docker build -t harvis-repo-sandbox:local ./repo-sandbox-engine
      HARVIS_ADAPTIVE_REPO_RUN_ENABLED: "${HARVIS_ADAPTIVE_REPO_RUN_ENABLED:-false}"
      HARVIS_ADAPTIVE_REPO_SANDBOX_IMAGE: "${HARVIS_ADAPTIVE_REPO_SANDBOX_IMAGE:-harvis-repo-sandbox:local}"
      HARVIS_ADAPTIVE_REPO_SANDBOX_NETWORK: "${HARVIS_ADAPTIVE_REPO_SANDBOX_NETWORK:-harvis_repo-sandbox}"
      HARVIS_ADAPTIVE_REPO_SANDBOX_CPUS: "${HARVIS_ADAPTIVE_REPO_SANDBOX_CPUS:-1.5}"
      HARVIS_ADAPTIVE_REPO_SANDBOX_MEM: "${HARVIS_ADAPTIVE_REPO_SANDBOX_MEM:-1500m}"
      HARVIS_ADAPTIVE_REPO_DEV_PORT: "${HARVIS_ADAPTIVE_REPO_DEV_PORT:-3000}"
      # Build/Code tab Run & Preview — run the code the agent just wrote for THIS
      # session, in the same sandbox, image and network as the Repo Runner above. The
      # session workspace is bind-mounted instead of cloned; nothing else differs.
      # Flag default OFF for the same reason: it executes code.
      HARVIS_VIBECODE_RUN_ENABLED: "${HARVIS_VIBECODE_RUN_ENABLED:-false}"
      HARVIS_VIBECODE_MAX_SANDBOXES: "${HARVIS_VIBECODE_MAX_SANDBOXES:-3}"
      # MCP connector runtime — runs a user's MCP servers as sibling containers
      # (stdio via npx/uvx) on the SAME isolated network and the SAME polyglot
      # image as the Repo Runner, because the backend image has no Node/uv and
      # an MCP server is third-party code. Flag default OFF; connector tools sit
      # in permission lane 5 and are gated on THIS flag, not HARVIS_SSH_ENABLED.
      HARVIS_MCP_RUNTIME_ENABLED: "${HARVIS_MCP_RUNTIME_ENABLED:-false}"
      HARVIS_MCP_SANDBOX_IMAGE: "${HARVIS_MCP_SANDBOX_IMAGE:-harvis-repo-sandbox:local}"
      HARVIS_MCP_SANDBOX_NETWORK: "${HARVIS_MCP_SANDBOX_NETWORK:-harvis_repo-sandbox}"
      HARVIS_MCP_SANDBOX_CPUS: "${HARVIS_MCP_SANDBOX_CPUS:-1.0}"
      HARVIS_MCP_SANDBOX_MEM: "${HARVIS_MCP_SANDBOX_MEM:-768m}"
      HARVIS_MCP_IDLE_TIMEOUT_S: "${HARVIS_MCP_IDLE_TIMEOUT_S:-900}"
      HARVIS_MCP_MAX_SESSIONS: "${HARVIS_MCP_MAX_SESSIONS:-8}"
      # Agent Reach — lane-5 public-web research (web_read / yt_transcript /
      # gh_view / rss_read). Flag default OFF: every tool reaches the public
      # internet from the backend, so it is opt-in per deploy. NEVER enable this
      # inside the egress-denied OpenClaw pod.
      HARVIS_AGENT_REACH_ENABLED: "${HARVIS_AGENT_REACH_ENABLED:-false}"
      # Screenshot-to-code self-check — renders the model's own HTML in the
      # locked-down preview container and feeds the PNG back for comparison.
      # Flag default OFF; costs one browser render + one vision call per loop.
      HARVIS_VISION_SELF_CHECK_ENABLED: "${HARVIS_VISION_SELF_CHECK_ENABLED:-false}"
      HARVIS_VISION_MAX_PREVIEWS: "${HARVIS_VISION_MAX_PREVIEWS:-2}"
      # Where the bundled SKILL.md files are mounted (repo-root ./skills is
      # outside the backend build context, so this can only come from a mount).
      HARVIS_SKILLS_DIR: "${HARVIS_SKILLS_DIR:-/app/skills/Harvis}"
      # HTML→PNG renderer for previews (Discord + Build screenshot_preview).
      # Points at preview-runner, NOT browser-runner: the HTML being rendered is
      # model-authored and untrusted, and preview-runner is the container that
      # forces safe mode and sits on an internal-only network.
      HARVIS_BROWSER_RUNNER_URL: "${HARVIS_BROWSER_RUNNER_URL:-http://preview-runner:8765}"
      HARVIS_OPENCODE_CONTAINER: "${HARVIS_OPENCODE_CONTAINER:-harvis-opencode}"
      HARVIS_OPENCODE_DEFAULT_MODEL: "${HARVIS_OPENCODE_DEFAULT_MODEL:-qwen3:4b}"
      HARVIS_OPENCODE_TIMEOUT_S: "${HARVIS_OPENCODE_TIMEOUT_S:-900}"
      # Phase E4 — Hermes NATIVE engine (SubAgentRunner + SOUL persona, no sidecar). Own
      # flag (decoupled from the external-engines flag). Flag default OFF.
      HARVIS_OWUI_HERMES_ENGINE: "${HARVIS_OWUI_HERMES_ENGINE:-}"
      HARVIS_HERMES_DEFAULT_MODEL: "${HARVIS_HERMES_DEFAULT_MODEL:-hermes3:3b}"
      # Phase E4B — Hermes AGENT app engine (the REAL Hermes Agent runtime in the
      # harvis-hermes-agent sidecar). Own flag, default OFF. The connector docker-execs
      # the sidecar per Build run (local Ollama, no cloud key).
      HARVIS_OWUI_HERMES_AGENT_ENGINE: "${HARVIS_OWUI_HERMES_AGENT_ENGINE:-}"
      HARVIS_HERMES_AGENT_CONTAINER: "${HARVIS_HERMES_AGENT_CONTAINER:-harvis-hermes-agent}"
      HARVIS_HERMES_OLLAMA_URL: "${HARVIS_HERMES_OLLAMA_URL:-${HARVIS_LLM_BASE_URL:-${OLLAMA_URL:-http://host.docker.internal:11434}}/v1}"
      HARVIS_HERMES_AGENT_DEFAULT_MODEL: "${HARVIS_HERMES_AGENT_DEFAULT_MODEL:-qwen3:4b}"
      # Image generation v0 — gated txt2img → workspace artifact. Providers probed at the
      # ComfyUI/A1111 hostnames below; flag default OFF (honest 403 until a provider is up
      # AND the flag is flipped). Enable per-deploy: HARVIS_OWUI_IMAGE_GENERATION=true.
      HARVIS_OWUI_IMAGE_GENERATION: "${HARVIS_OWUI_IMAGE_GENERATION:-false}"
      HARVIS_IMAGE_COMFYUI_URL: "${HARVIS_IMAGE_COMFYUI_URL:-http://harvis-comfyui:8188}"
      HARVIS_IMAGE_A1111_URL: "${HARVIS_IMAGE_A1111_URL:-http://harvis-a1111:7860}"
      # E4B Chat: the facade proxies the "hermes-agent" chat model to the sidecar's
      # OpenAI-compatible API server (:8642). Key MUST match the sidecar's API_SERVER_KEY.
      HARVIS_HERMES_API_SERVER_KEY: "${HARVIS_HERMES_API_SERVER_KEY:-harvis-hermes-local-dev}"
      HARVIS_HERMES_AGENT_CHAT_URL: "${HARVIS_HERMES_AGENT_CHAT_URL:-http://harvis-hermes-agent:8642}"
      HARVIS_ATTACHED_REPOS: "${HARVIS_ATTACHED_REPOS:-/data/attached-repos/harvis}"
      # Writable repos for opt-in VibeCode in-place mode (parallel :rw mount).
      HARVIS_ATTACHED_REPOS_RW: "${HARVIS_ATTACHED_REPOS_RW:-/data/attached-repos-rw/harvis}"
      # Optional in-container browse tree for allowlisted-repo flows. The PRIMARY
      # "Open folder…" path is the browser's File System Access API (no mount needed).
      HARVIS_FS_BROWSE_ROOT: "${HARVIS_FS_BROWSE_ROOT:-/data/host-fs}"
      HARVIS_FS_BROWSE_ROOT_HOST: "${HARVIS_FS_BROWSE_ROOT_HOST:-./harvis-fs-browse}"
      # READ-WRITE host-folder browse root → the "Open folder…" picker lists real projects under
      # it. Browsed folders default to CLONE-mode; in-place on them is OFF until the ladder + an
      # exec sandbox are verified (HARVIS_INPLACE_ON_BROWSED). Point HARVIS_FS_BROWSE_ROOT_RW_HOST
      # at a deliberate, SECRETS-FREE projects dir.
      HARVIS_FS_BROWSE_ROOT_RW: "${HARVIS_FS_BROWSE_ROOT_RW:-/data/host-fs-rw}"
      # Host-side path of the RW browse root — display-only (shown in the picker) + drives the
      # "still the default sandbox" empty-state hint. Set this to your real, SECRETS-FREE projects dir.
      HARVIS_FS_BROWSE_ROOT_RW_HOST: "${HARVIS_FS_BROWSE_ROOT_RW_HOST:-./harvis-fs-browse}"
      # In-place editing of a BROWSED folder's real files. OFF by default (browsed = clone-mode).
      HARVIS_INPLACE_ON_BROWSED: "${HARVIS_INPLACE_ON_BROWSED:-false}"
      # Host path of the primary attached repo — user-facing labels only (optional).
      HARVIS_ATTACH_REPO_HOST: "${HARVIS_ATTACH_REPO:-}"
      # GitHub OAuth for repo mounting
      GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID:-}"
      GITHUB_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET:-}"
      FERNET_KEY: "${FERNET_KEY:-}"
      OAUTH_REDIRECT_BASE: "http://localhost:9000"
    user: "1001:1001" # Run as appuser for consistent permissions
    volumes:
      - ml-models-cache:/models-cache
      - embedding-data:/app/embedding
      - /tmp:/tmp
      # ⚠ HOST ROOT. Anything that can create a container with an arbitrary bind
      # mount can read and write the whole host filesystem as root. This mount
      # is deliberate and load-bearing — four shipped features are built on it:
      #
      #   workspace/terminal_container.py  the isolated per-session runner
      #   owui_compat/repo_sandbox.py      dev-server preview boxes
      #   vibecoding/containers.py         vibecode session containers
      #   owui_compat/integrations_status.py  container status for the UI
      #
      # Worth being precise about the first one, because the intuition runs
      # backwards: the isolated runner is what *mitigates* this. Build Space
      # Phase 3 moved the AI's `exec` / `run_tests` out of the backend process
      # and into a socket-less sibling container on a network no Harvis service
      # rides. Un-mounting the socket would not harden the backend — it would
      # delete the sandbox and send exec back into the process that holds host
      # root. A docker-socket-proxy does not help either: the runner needs
      # container-create with binds, which is the host-root primitive itself.
      #
      # So the boundary is: trust the backend, or run without Build Space. There
      # is no third option short of a Jobs runtime (see workspace/harvis_readiness.py,
      # which already reports this honestly for the k8s lanes).
      - /var/run/docker.sock:/var/run/docker.sock
      - ./python_back_end/main.py:/app/main.py:ro
      - ./python_back_end/setup_flow.py:/app/setup_flow.py:ro
      - ./python_back_end/moonshot_api.py:/app/moonshot_api.py:ro
      # main.py calls into these three, so leaving them baked into the image while
      # main.py is mounted lets the two drift apart: a restart deploys the caller
      # but not the callee, and the mismatch surfaces as a TypeError at request
      # time rather than at boot. Mount whatever main.py imports directly.
      - ./python_back_end/agent_research.py:/app/agent_research.py:ro
      - ./python_back_end/model_manager.py:/app/model_manager.py:ro
      - ./python_back_end/transcription.py:/app/transcription.py:ro
      - ./python_back_end/synthesis.py:/app/synthesis.py:ro
      # main.py imports vison_models.llm_connector, so by the rule above this
      # belongs here. It was the one direct import left unmounted, and the gap
      # is not theoretical: renaming query_qwen -> query_vision deployed the new
      # main.py against the image's old connector and the backend crash-looped
      # on ImportError at boot.
      - ./python_back_end/vison_models:/app/vison_models:ro
      - ./python_back_end/research:/app/research:ro
      - ./python_back_end/workspace:/app/workspace:ro
      - ./python_back_end/image:/app/image:ro
      - ./python_back_end/tools:/app/tools:ro
      - ./python_back_end/integrations:/app/integrations:ro
      - ./python_back_end/plugins:/app/plugins:ro
      - ./python_back_end/owui_compat:/app/owui_compat:ro
      # main.py replays migrations/010-017 on every boot, but migrations/ was
      # only ever baked into the image. The image here predates 016, so boot
      # logged "Migration file missing" for it and inference_nodes existed only
      # because someone had copied the file in by hand — a fresh deploy from
      # this image would come up without the table. Mounted like the packages
      # above so a new .sql file is live on restart instead of on rebuild.
      - ./python_back_end/migrations:/app/migrations:ro
      - ./python_back_end/onb_compat:/app/onb_compat:ro
      - ./python_back_end/open_notebook:/app/open_notebook:ro
      - ./openclaw/config:/app/openclaw_config
      # Shared engine skills tree — RW here (the backend publishes into it), :ro in
      # every engine sidecar. Same host path OpenClaw already mounted at /skills, so
      # existing published skills carry over untouched.
      - ./openclaw/skills/${OPENCLAW_CONFIG_SET:-bundled}:/app/engine_skills:rw
      - ./python_back_end/notebooks:/app/notebooks:ro
      - ./python_back_end/vibecoding:/app/vibecoding:ro
      # Agent Reach (lane-5 public research), screenshot-to-code, and the skillopt
      # offline job. All three are imported LAZILY by workspace/orchestration, so a
      # missing mount fails silently at runtime instead of crashing at boot — which
      # is exactly how they shipped invisible to this container.
      - ./python_back_end/agent_reach:/app/agent_reach:ro
      - ./python_back_end/vision_to_code:/app/vision_to_code:ro
      - ./python_back_end/skills_training:/app/skills_training:ro
      # Bundled SKILL.md files live at the REPO ROOT, outside the ./python_back_end
      # build context — no image rebuild can ever bake them in. Read-only: the seeder
      # reads these into Postgres, it never writes back.
      - ./skills:/app/skills:ro
      # SSH scaffold (marathon P7) — main.py imports remote.ssh_manager; without
      # this mount the backend crashes on boot with ModuleNotFoundError. The
      # module is inert (HARVIS_SSH_ENABLED off → every route 403s).
      - ./python_back_end/remote:/app/remote:ro
      - ./python_back_end/cookbook:/app/cookbook:ro
      - ./python_back_end/deep_research:/app/deep_research:ro
      # The last seven direct imports of main.py that were still coming from the
      # image. The rule three comments up was written but never finished, and the
      # drift it warns about was real: commit 3c8616b2 (2026-07-19) added the
      # server-side require_admin gate to rag_corpus, the image was built
      # 2026-07-17, so the gate was committed but never running here.
      - ./python_back_end/artifacts:/app/artifacts:ro
      - ./python_back_end/auth_optimized.py:/app/auth_optimized.py:ro
      - ./python_back_end/chat_history_module:/app/chat_history_module:ro
      - ./python_back_end/file_processing.py:/app/file_processing.py:ro
      - ./python_back_end/gemini_api.py:/app/gemini_api.py:ro
      - ./python_back_end/job_queue.py:/app/job_queue.py:ro
      - ./python_back_end/rag_corpus:/app/rag_corpus:ro
      - artifact_data:/data/artifacts
      - openclaw-projects:/data/openclaw-projects
      # Phase 4 SSH state — per-user pinned known_hosts (0700) + ephemeral 0600
      # key temp files. Named volume so trust survives redeploys; the image
      # pre-creates /data/ssh_state owned by appuser(1001) so the fresh volume
      # inherits writable ownership.
      - ssh_state:/data/ssh_state
      # Real local repo, READ-ONLY, for orchestrated clone-local "attached" isolation.
      # The agent only ever clones FROM this — it can never write the live repo.
      - ${HARVIS_ATTACH_REPO:-./harvis-fs-browse/demo-repo}:/data/attached-repos/harvis:ro
      # Parallel READ-WRITE mount of the SAME repo for opt-in VibeCode "in-place" mode
      # (the agent edits the real repo on a session branch — no clone). Distinct from the
      # :ro mount above, so clone-mode keeps its read-only containment untouched. Only
      # allowlisted via HARVIS_ATTACHED_REPOS_RW; every write gated by the permission ladder.
      - ${HARVIS_ATTACH_REPO:-./harvis-fs-browse/demo-repo}:/data/attached-repos-rw/harvis:rw
      # Optional in-container browse tree for allowlisted-repo flows (most users leave
      # this as the empty placeholder — local editing uses the browser File System Access API).
      - ${HARVIS_FS_BROWSE_ROOT_HOST:-./harvis-fs-browse}:/data/host-fs:ro
      # READ-WRITE host-folder browse tree → "Open folder…" lists real projects here.
      # ⚠ The agent's `exec` is NOT yet sandboxed: a rogue command can touch anything under this
      # mount. Even ~/Projects holds per-repo .env files (secrets) — point
      # HARVIS_FS_BROWSE_ROOT_RW_HOST at a deliberate, SECRETS-FREE projects dir, never your home.
      # Browsed folders are clone-mode by default; flip HARVIS_INPLACE_ON_BROWSED only once the
      # permission ladder + an exec sandbox are verified.
      - ${HARVIS_FS_BROWSE_ROOT_RW_HOST:-./harvis-fs-browse}:/data/host-fs-rw:rw
      # Write-through to a host-native OpenClaw config, so Discord /model
      # propagates to a BYO gateway. Defaults to a repo-local directory: a
      # fresh install has no native OpenClaw, and Docker CREATES a missing
      # bind-mount source — an absolute default would plant a root-owned
      # directory on every installer's machine. Point
      # HOST_OPENCLAW_CONFIG_HOST_PATH at ~/.openclaw in .env if you run one.
      # Requires the file to be writable by UID 1001 (appuser) — chmod 664
      # and chgrp to a shared group if needed.
      - "${HOST_OPENCLAW_CONFIG_HOST_PATH:-./harvis-openclaw-config}:/host-openclaw:rw"
    networks:
      - ollama-n8n-network
      - openclaw-internal
      - cad-internal
      - repo-sandbox
      # Reaches preview-runner, which renders untrusted model-authored HTML.
      # preview-net is internal:true, so nothing on it can reach the internet.
      - preview-net
    extra_hosts:
      # Allow backend container to reach host-installed openclaw gateway on :18790
      - "host.docker.internal:host-gateway"
    depends_on:
      pgsql:
        condition: service_healthy
      artifact-init:
        condition: service_completed_successfully
      # NOTE: ollama + ollama-model-check + model-downloader were cut for the
      # same reason as the block below. lifespan() and startup_event() touch
      # Postgres only; /api/health/services probes Ollama per request and
      # reports up|degraded|down instead of blocking boot. ollama-model-check
      # is detect-only and exits 0 even when Ollama never answers. And
      # model-downloader now rides the `voice` profile — keeping it here made
      # every fresh install download the Whisper/Chatterbox/Qwen3-TTS voice
      # weights before the app could start (and a default service may never
      # depend on a profiled one, or Compose refuses to schedule it).
      # NOTE: openclaw + browser-runner are deliberately NOT depends_on.
      # The backend never contacts either at startup — both lifespan() and
      # startup_event() touch Postgres only, and the openclaw/browser routers
      # proxy lazily at request time (/api/services/health probes them per
      # request). Keeping them here made two optional capabilities into hard
      # boot blockers and prevented profile-gating them. Availability is
      # reported by the health probe, not enforced by the boot order.

  # Tier 3 Browser Runner (Firefox sandbox) - internal only
  browser-runner:
    # Shared image name with preview-runner: same context, same Dockerfile, so
    # they must not land on disk twice (the fresh-install size budget counts
    # every image).
    image: harvis-browser-runner:latest
    build:
      context: ./browser_runner
      dockerfile: Dockerfile
      args:
        # Stamped into org.opencontainers.image.revision. Unset locally, so a
        # developer build is honestly labelled "unknown" rather than carrying a
        # stale sha; CI exports HARVIS_VCS_REF and gets the real one.
        VCS_REF: ${HARVIS_VCS_REF:-unknown}
    container_name: ${HARVIS_CONTAINER_PREFIX:-}harvis-browser-runner
    restart: unless-stopped
    networks:
      - openclaw-internal
      - ollama-n8n-network
    volumes:
      # Each teammate's Firefox profile — its cookies, its logins, its history.
      # A named volume, never a host path, because the same compose file has to
      # come up unchanged on Docker Desktop for Windows and macOS. preview-runner
      # deliberately does NOT mount this: it renders untrusted model-authored
      # HTML, and nothing untrusted should ever see a teammate's session.
      - agent-browser-profiles:/profiles
    expose:
      # 8765 = the automation API. 6080 = the one websockify port every watchable
      # session is multiplexed onto by token; nginx proxies it at /agents/vnc/,
      # so no new host port is published on any platform.
      - "8765"
      - "6080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8765/health || curl -sf http://localhost:8765/docs || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Preview Runner — renders UNTRUSTED, model-authored HTML (screenshot-to-code,
  # Discord previews). Same image as browser-runner, so it costs no extra disk;
  # what differs is the containment:
  #   - HARVIS_PREVIEW_SAFE_MODE_FORCED=1 means a caller CANNOT ask for
  #     JavaScript or network, whatever it sends in the request body;
  #   - preview-net is internal:true, so even a browser bug can't reach the
  #     internet, and the container is on no other network, so it can't reach
  #     pgsql, ollama, or openclaw either;
  #   - no ports: — not reachable from the host.
  # browser-runner stays as-is for the trusted browsing lane, which needs both.
  preview-runner:
    image: harvis-browser-runner:latest
    build:
      context: ./browser_runner
      dockerfile: Dockerfile
      args:
        VCS_REF: ${HARVIS_VCS_REF:-unknown}
    container_name: ${HARVIS_CONTAINER_PREFIX:-}harvis-preview-runner
    restart: unless-stopped
    environment:
      HARVIS_PREVIEW_SAFE_MODE: "1"
      HARVIS_PREVIEW_SAFE_MODE_FORCED: "1"
      HARVIS_BROWSER_MAX_SESSIONS: "${HARVIS_PREVIEW_MAX_SESSIONS:-4}"
    networks:
      - preview-net
    expose:
      - "8765"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8765/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Next.js Frontend (New UI)
  # REBUILD TIPS:
  #   Quick rebuild (use cache):   docker-compose build frontend
  #   Smart rebuild (recommended): ./scripts/rebuild-frontend.sh
  #   Full rebuild (no cache):     ./scripts/rebuild-frontend.sh --no-cache
  frontend:
    # Reaches an LLM server running on the HOST (the default is the operator's
    # own Ollama/LM Studio/llama.cpp/vLLM on 127.0.0.1). Linux needs this
    # mapping explicitly; without it host.docker.internal does not resolve.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: ./front_end/newjfrontend
      dockerfile: Dockerfile
      args:
        # These args help bust Docker cache when rebuilding
        # Change BUILD_TIMESTAMP to force a fresh build
        BUILD_TIMESTAMP: ${BUILD_TIMESTAMP:-default}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    container_name: ${HARVIS_CONTAINER_PREFIX:-}harvis-frontend
    profiles: ["legacy"]
    restart: unless-stopped
    ports:
      # Legacy Next frontend. nginx proxies to it as http://frontend:3000.
      - "${HARVIS_BIND_ADDR:-127.0.0.1}:${HARVIS_PORT_FRONTEND:-3000}:3000"
    environment:
      NODE_ENV: "production"
      NEXT_TELEMETRY_DISABLED: "1"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set in .env}"
      BACKEND_URL: "http://backend:8000"
      OLLAMA_URL: "${HARVIS_LLM_BASE_URL:-${OLLAMA_URL:-http://host.docker.internal:11434}}"
    depends_on:
      - backend
      - pgsql
    deploy:
      resources:
        limits:
          memory: 1512M
    networks:
      - ollama-n8n-network

  # Builds the OpenWebUI (Svelte) static frontend INSIDE Docker so a fresh clone
  # needs no host Node/npm. Reuses the `build` stage of the owui Dockerfile
  # (npm ci → npm run build → /app/build), then copies the static bundle into the
  # host ./front_end/owui/build dir that nginx serves. Runs once and exits (0).
  #
  # Idempotent: skips the copy when a build is already present, so a host-side
  # `npm run build` dev loop is left untouched. To force a refresh on a deploy:
  # clear front_end/owui/build (or `docker compose build owui-builder`) then `up`.
  # NOTE: the frontend build fetches pyodide, so it needs internet at BUILD time.
  owui-builder:
    build:
      context: ./front_end/owui
      dockerfile: Dockerfile
      # `artifact` = busybox + the compiled output only. Targeting `build`
      # tagged the whole Node build stage (5.25 GB) to ship ~263 MB.
      target: artifact
      args:
        # Stamped into org.opencontainers.image.revision. Unset locally, so a
        # developer build is honestly labelled "unknown" rather than carrying a
        # stale sha; CI exports HARVIS_VCS_REF and gets the real one.
        VCS_REF: ${HARVIS_VCS_REF:-unknown}
    image: harvis-owui-builder:local
    # Local build tag — tell Compose to build it, not pull it (a bare
    # `docker compose up -d` without --build otherwise fails: pull access denied).
    pull_policy: build
    container_name: ${HARVIS_CONTAINER_PREFIX:-}harvis-owui-builder
    restart: "no"
    volumes:
      - ./front_end/owui/build:/out
    command:
      - sh
      - -c
      - >
        if [ -f /out/index.html ]; then
          echo 'owui build already present in ./front_end/owui/build — skipping (clear it to force a rebuild)';
        else
          echo 'Populating ./front_end/owui/build from the Docker build...';
          cp -a /app/build/. /out/ && echo 'owui frontend build ready';
        fi
    networks:
      - ollama-n8n-network

  # Same idea as owui-builder, for the vendored Hermes desktop UI. Hermes is
  # Harvis's primary application shell, so its static build is part of the
  # normal install. This is a one-shot build step; it neither starts a model
  # service nor downloads model weights.
  #
  # Context is ./front_end (not the UI dir) because the build also needs
  # ./front_end/hermes-shared — see front_end/hermes-desktop-ui/Dockerfile.
  hermes-ui-builder:
    build:
      context: ./front_end
      dockerfile: hermes-desktop-ui/Dockerfile
      target: artifact
      args:
        # Must match nginx's `location /hermes-api/`, which proxies to the
        # backend facade. Baked into the bundle at build time — changing it
        # changes the stamp below, so the new bytes actually get published.
        VITE_HERMES_API_BASE: "${HARVIS_HERMES_UI_API_BASE:-/hermes-api}"
        # Lower this on a machine with little RAM; the build is the only place
        # Harvis asks for a big Node heap.
        HERMES_UI_NODE_HEAP_MB: "${HARVIS_HERMES_UI_NODE_HEAP_MB:-8192}"
    image: harvis-hermes-ui-builder:local
    pull_policy: build
    container_name: ${HARVIS_CONTAINER_PREFIX:-}harvis-hermes-ui-builder
    restart: "no"
    volumes:
      - ./front_end/hermes-desktop-ui/dist:/out
    # Publish only when the host copy differs from the image's, compared by the
    # stamp the Dockerfile writes. The old guard skipped whenever index.html
    # existed, which meant a corrected build could never reach a machine that had
    # built once — dist/ is gitignored, so only fresh clones ever got new bytes.
    # This step never exits non-zero: nginx gates on it, and a publish failure
    # should cost /hermes a 404, not take the whole proxy (and OWUI with it) down.
    command:
      - sh
      - -c
      - >
        if [ -f /out/.harvis-build-id ] && cmp -s /app/dist/.harvis-build-id /out/.harvis-build-id; then
          echo 'hermes UI build in ./front_end/hermes-desktop-ui/dist is current — skipping';
        else
          echo 'Publishing the hermes UI build to ./front_end/hermes-desktop-ui/dist...';
          rm -rf /out/assets /out/.harvis-build-id;
          if cp -a /app/dist/. /out/; then
            echo 'hermes UI build ready';
          else
            echo 'WARNING: could not publish the hermes UI build - /hermes will 404 until this is fixed' >&2;
          fi;
        fi
    networks:
      - ollama-n8n-network

  # Nginx Reverse Proxy
  nginx:
    # No `user:` on purpose. The upstream image starts its master as root to
    # read the config and then drops every worker to the unprivileged `nginx`
    # user itself; setting `user:` here would break that and gain nothing.
    image: nginx:1.29.6-alpine@sha256:f46cb72c7df02710e693e863a983ac42f6a9579058a59a35f1ae36c9958e4ce0
    container_name: ${HARVIS_CONTAINER_PREFIX:-}nginx-proxy
    restart: unless-stopped
    ports:
      # The front door, and the only port meant to leave this machine. It is
      # the one surface behind a login. Everything else is loopback-only.
      - "${HARVIS_BIND_ADDR_PUBLIC:-0.0.0.0}:${HARVIS_PORT_NGINX:-9000}:80"
      # Untrusted repo-preview origin (Adaptive Workspace Repo Runner live app
      # preview). Bound to localhost only so preview dev servers are reachable
      # from the local user's browser but never exposed on the LAN.
      - "127.0.0.1:9002:9002"
      # The HTTPS front door. Nothing listens here until ./scripts/enable-https.sh
      # has run — until then nginx has no 443 server block and the port simply
      # refuses connections, which costs nothing. Publishing it up front is what
      # lets that script finish with `up -d nginx` instead of asking the user to
      # hand-edit this file.
      #
      # Worth turning on: browsers only grant the microphone to a "secure
      # context". http://localhost is one, so voice works on this machine and
      # fails on every other device reaching Harvis at http://<ip>:9000.
      - "${HARVIS_BIND_ADDR_PUBLIC:-0.0.0.0}:${HARVIS_HTTPS_PORT:-9443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./front_end/owui/build:/usr/share/nginx/owui:ro
      # Vendored Hermes desktop UI, served at /hermes (see nginx-harvis.conf).
      # Read-only and independent of owui: if the dir is empty /hermes 404s and
      # every other route is unaffected.
      - ./front_end/hermes-desktop-ui/dist:/usr/share/nginx/hermes:ro
      # Every route, shared by the HTTP and HTTPS listeners so they cannot drift.
      - ./nginx-harvis.conf:/etc/nginx/harvis.conf:ro
      # Holds the HTTPS listener and its certificate. On a stock install it has
      # neither: nginx.conf globs this directory for *.conf and an include
      # matching zero files is not an error, so HTTPS stays off until
      # ./scripts/enable-https.sh puts both here.
      - ./nginx/tls:/etc/nginx/tls:ro
      - /tmp:/tmp:ro
    depends_on:
      # long-form so nginx waits for the one-shot owui-builder to finish
      # populating the static bundle before it starts serving.
      owui-builder:
        condition: service_completed_successfully
      hermes-ui-builder:
        condition: service_completed_successfully
      backend:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 64M
    networks:
      - ollama-n8n-network

  # Vendored open-notebook Next.js frontend, served at /onb (nginx proxies here).
  # Talks to the Harvis backend's onb_compat facade (/onb-api) via Next rewrites.
  # Distinct from the `open-notebook` service below (the official lfnovo image on
  # its own SurrealDB) — this one runs on the Harvis notebooks backend.
  open-notebook-ui:
    build:
      context: ./front_end/open-notebook
    container_name: ${HARVIS_CONTAINER_PREFIX:-}harvis-open-notebook
    profiles: ["notebooks"]
    restart: unless-stopped
    environment:
      INTERNAL_API_URL: "http://backend:8000"
      PORT: "8502"
      NODE_ENV: "production"
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - ollama-n8n-network

  # Document Generation Worker (Async Job Processor)
  # Handles PDF, DOCX, XLSX, PPTX generation in background
  # No GPU/ML dependencies, but NOT lightweight: measured 1.41 GB via `docker images`,
  # which makes it the expensive half of the `notebooks` pack (open-notebook-ui is only
  # 278 MB). The old "~200MB" claim here was off by 7x and understated the pack's cost.
  document-worker:
    # Reaches an LLM server running on the HOST (the default is the operator's
    # own Ollama/LM Studio/llama.cpp/vLLM on 127.0.0.1). Linux needs this
    # mapping explicitly; without it host.docker.internal does not resolve.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: ./python_back_end
      dockerfile: Dockerfile.document-worker
    container_name: ${HARVIS_CONTAINER_PREFIX:-}harvis-document-worker
    profiles: ["notebooks"]
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://pguser:${POSTGRES_PASSWORD:-pgpassword}@pgsql:5432/database"
      OLLAMA_URL: "${HARVIS_LLM_BASE_URL:-${OLLAMA_URL:-http://host.docker.internal:11434}}"
      BACKEND_URL: "http://backend:8000"
      ENVIRONMENT: "production"
      LOG_LEVEL: "INFO"
      PYTHONUNBUFFERED: "1"
      ARTIFACT_STORAGE_DIR: "/data/artifacts"
      WORKER_NAME: "document-worker-docker"
    user: "1001:1001"
    volumes:
      - artifact_data:/data/artifacts
    depends_on:
      pgsql:
        condition: service_healthy
      backend:
        condition: service_started
      artifact-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          cpus: '0.25'
    networks:
      - ollama-n8n-network
    healthcheck:
      test: [ "CMD-SHELL", "python -c 'import asyncpg; import openpyxl; print(\"healthy\")'" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL Database with pgvector
  pgsql:
    # Digest-pinned. "pg15" floats across every 15.x patch release, and this is
    # the container holding all user data — a silent minor-version swap on a
    # `compose pull` is the one image where that matters most.
    image: pgvector/pgvector:pg15@sha256:7f5681e45237acdf546cf7cdc0dfc0ed7752ede857fda6e54f6ea21b936f8742
    container_name: ${HARVIS_CONTAINER_PREFIX:-}pgsql-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pguser
      # Generated by install.sh on a fresh database; falls back to the
      # historical default so existing volumes keep working.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pgpassword}
      POSTGRES_DB: database
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    volumes:
      - pgsql_data:/var/lib/postgresql/data
      # Initdb runs mounted files in sorted order. 000_extensions must sort
      # first (extensions before any schema), and 000_schemas (users/
      # chat_sessions/chat_messages) must sort before 001_add_document_jobs,
      # whose FKs reference those tables — without it a fresh volume aborts.
      - ./python_back_end/migrations/000_extensions.sql:/docker-entrypoint-initdb.d/000_extensions.sql:ro
      - ./python_back_end/all_schemas_safe.sql:/docker-entrypoint-initdb.d/000_schemas.sql:ro
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
      - ./python_back_end/artifacts_schema.sql:/docker-entrypoint-initdb.d/artifacts_schema.sql:ro
      - ./python_back_end/artifacts_build_jobs_schema.sql:/docker-entrypoint-initdb.d/artifacts_build_jobs_schema.sql:ro
      - ./front_end/newjfrontend/db/migrations/001_add_document_jobs.sql:/docker-entrypoint-initdb.d/001_add_document_jobs.sql:ro
      - ./python_back_end/workspace/workspace_schema.sql:/docker-entrypoint-initdb.d/002_workspace_schema.sql:ro
      - ./python_back_end/migrations/010_user_openclaw_config.sql:/docker-entrypoint-initdb.d/003_user_openclaw_config.sql:ro
    ports:
      # PostgreSQL. Loopback-only: it holds every chat, credential and user
      # row, and it ships with well-known default credentials, so publishing
      # it on 0.0.0.0 hands the whole database to anyone on the LAN. Nothing
      # outside this compose file needs it — containers use pgsql:5432.
      - "${HARVIS_BIND_ADDR:-127.0.0.1}:${HARVIS_PORT_POSTGRES:-5432}:5432"
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - ollama-n8n-network
      - openclaw-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pguser -d database"]
      interval: 10s
      timeout: 5s
      retries: 5


  # ═══════════════════════════════════════════════════════════════════════════
  # OpenClaw Agent Gateway
  # ═══════════════════════════════════════════════════════════════════════════

  # DB schema init — runs once per stack start (idempotent CREATE IF NOT EXISTS)
  openclaw-db-init:
    image: postgres:15-alpine@sha256:fceb6f86328c36f2438fae3b851b0cc57c4a7e69a58c866d9ce24281f2cf0c9c
    container_name: ${HARVIS_CONTAINER_PREFIX:-}harvis-openclaw-db-init
    profiles: ["engines"]
    restart: "no"
    command: >
      sh -c "
        echo 'Waiting for PostgreSQL...' &&
        until pg_isready -h pgsql -U pguser -d database; do
          echo 'PostgreSQL not ready, retrying in 2s...'; sleep 2;
        done &&
        echo 'Creating OpenClaw tables...' &&
        psql postgresql://pguser:${POSTGRES_PASSWORD:-pgpassword}@pgsql:5432/database <<'SQL'
          CREATE TABLE IF NOT EXISTS openclaw_sessions (
            id           SERIAL PRIMARY KEY,
            session_key  TEXT UNIQUE NOT NULL,
            agent_id     TEXT NOT NULL,
            display_name TEXT,
            model_id     TEXT,
            created_at   TIMESTAMPTZ NOT NULL DEFAULT NOW(),
            updated_at   TIMESTAMPTZ NOT NULL DEFAULT NOW(),
            tokens_in    INTEGER DEFAULT 0,
            tokens_out   INTEGER DEFAULT 0,
            cost_usd     NUMERIC(12, 8) DEFAULT 0,
            metadata     JSONB DEFAULT '{}'
          );
          CREATE TABLE IF NOT EXISTS openclaw_messages (
            id           SERIAL PRIMARY KEY,
            session_key  TEXT NOT NULL REFERENCES openclaw_sessions(session_key),
            msg_id       TEXT NOT NULL,
            role         TEXT NOT NULL,
            content      JSONB NOT NULL,
            metadata     JSONB DEFAULT '{}',
            created_at   TIMESTAMPTZ NOT NULL DEFAULT NOW()
          );
          CREATE INDEX IF NOT EXISTS idx_oc_sessions_agent
            ON openclaw_sessions(agent_id);
          CREATE INDEX IF NOT EXISTS idx_oc_sessions_updated
            ON openclaw_sessions(updated_at);
          CREATE INDEX IF NOT EXISTS idx_oc_messages_session
            ON openclaw_messages(session_key, created_at);
        SQL
        echo 'OpenClaw schema ready!'
      "
    depends_on:
      pgsql:
        condition: service_healthy
    networks:
      - openclaw-internal

  # OpenClaw agent gateway — isolated agent backend for Harvis Workspaces + Discord.
  # NO ports exposed to host — only reachable from backend via openclaw-internal.
  # Discord channel driver connects outbound to Discord gateway (port 443).
  openclaw:
    build:
      context: .
      dockerfile: openclaw-browser/Dockerfile
    # Digest-only: this image publishes no version tag and no version label, so
    # a digest is the only thing that identifies it. Re-pin deliberately when
    # you want a newer OpenClaw browser build.
    image: dulc3/openclaw-browser@sha256:584a24f8715223fc76d14cb6b8c8eab449c9fd48b9456d6bdfe39ab5b1a426c1
    # Registry-style tag but we build it locally — force build so a bare
    # `docker compose up -d` doesn't try to pull it.
    pull_policy: build
    container_name: ${HARVIS_CONTAINER_PREFIX:-}harvis-openclaw
    profiles: ["engines"]
    restart: unless-stopped
    user: "1000:1000"
    # Expose to localhost ONLY for Cursor extension — never 0.0.0.0
    ports:
      - "127.0.0.1:${HARVIS_PORT_OPENCLAW:-18789}:18789"
    # Chromium needs shared memory — Docker default 64MB causes tab crashes
    shm_size: '256m'
    tmpfs:
      - /tmp/.chromium:size=128m
    environment:
      HOME: /home/node
      NODE_ENV: production
      TERM: xterm-256color
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_GATEWAY_TOKEN: "${OPENCLAW_GATEWAY_TOKEN_BUNDLED:-${OPENCLAW_GATEWAY_TOKEN}}"
      OPENCLAW_MODE: "${OPENCLAW_MODE:-bundled}"
      OLLAMA_API_KEY: "ollama-local"
      DATABASE_URL: "postgresql://pguser:${POSTGRES_PASSWORD:-pgpassword}@pgsql:5432/database"
      GH_TOKEN: "${HARVIS_GITHUB_TOKEN:-}"
      GH_USER: "${HARVIS_GITHUB_USER:-}"
      GH_EMAIL: "${HARVIS_GITHUB_EMAIL:-}"
      # Chromium discovery for OpenClaw's native browser tool
      CHROME_BIN: /usr/bin/chromium
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
    volumes:
      - openclaw-data:/home/node/.openclaw
      # Mode-specific config set (default: bundled)
      # RW so `openclaw plugins install/enable` can update the config via
      # atomic rename. The host file lives in the repo so writes are visible
      # in git status and reversible. Was :ro pre-2026-05-24 — flipped when
      # B7 (custom MCP tool plugins) needed OpenClaw to register installs.
      - ./openclaw/config/${OPENCLAW_CONFIG_SET:-bundled}/openclaw.json:/home/node/.openclaw/openclaw.json:rw
      # NOTE: exec-approvals.json bind mount removed 2026-05-24 (B7/v4 work).
      # OpenClaw v2026.5.x rewrites this file on every exec via atomic
      # temp-file-rename (write tmp, rename tmp → target). Linux refuses to
      # rename over a single-file bind mount with EBUSY because the inode
      # is pinned by the mount — every exec fails. Same root cause as the
      # openclaw.json case above, but :rw doesn't help here because the
      # failure is on the rename, not the open-for-write.
      # The file now lives in the openclaw-data volume only. On a fresh
      # volume, OpenClaw v4 creates the file with library defaults; if
      # the defaults need tightening (ask: "off", askFallback: "allow"),
      # seed via `docker exec harvis-openclaw bash -c 'cat > ... <<EOF'`
      # after first boot. Tonight's volume already carries a populated
      # copy from earlier sessions.
      # Shared identity files
      - ./openclaw/config/shared/IDENTITY.md:/home/node/.openclaw/IDENTITY.md:ro
      - ./openclaw/config/shared/SOUL.md:/home/node/.openclaw/SOUL.md:ro
      # Mode-specific identity overrides + skills
      - ./openclaw/config/${OPENCLAW_CONFIG_SET:-bundled}/USER.md:/home/node/.openclaw/USER.md:ro
      - ./openclaw/config/${OPENCLAW_CONFIG_SET:-bundled}/AGENT.md:/home/node/.openclaw/AGENT.md:ro
      # Skills are writable so the agent can edit its own behavior. Identity
      # files (IDENTITY.md / SOUL.md / USER.md / AGENT.md) are mounted
      # separately as :ro elsewhere — those stay locked. The agent edits skills
      # via the existing `exec` tool (e.g. `cat > /skills-shared/harvis-X/SKILL.md`).
      - ./openclaw/skills/${OPENCLAW_CONFIG_SET:-bundled}:/skills:rw
      - ./openclaw/skills/shared:/skills-shared:rw
      # Mode-specific heartbeat workspace files
      - ./openclaw/config/${OPENCLAW_CONFIG_SET:-bundled}/HEARTBEAT.md:/home/node/.openclaw/workspace/HEARTBEAT.md:ro
      - ./openclaw/scripts/${OPENCLAW_CONFIG_SET:-bundled}:/home/node/.openclaw/workspace/scripts:ro
      # Shared projects volume — backend writes repos, OpenClaw reads/writes code
      - openclaw-projects:/home/node/projects
      # Local OpenClaw tool plugins (built artifacts + manifest) — installed
      # via `openclaw plugins install --link /openclaw-plugins/<id>`. Path is
      # stable across rebuilds because it lives in the repo. RW so the
      # container can `npm install` runtime deps (typebox) alongside dist/.
      - ./openclaw/plugins:/openclaw-plugins:rw
    # OpenClaw is npm-installed globally in the image (see
    # openclaw-browser/Dockerfile). The `openclaw` binary is on PATH; the
    # prior `node openclaw.mjs ...` form only worked when openclaw.mjs was
    # in PWD, which required the dulc3/openclaw base image's filesystem
    # layout. Now we invoke the CLI directly.
    # Wrap the gateway with a background auto-approver. On a FRESH openclaw-data
    # volume the backend's device lands "pending" — openclaw v2026.5.22 does not
    # honor skipPairingForOperatorSharedAuth despite the backend sending the
    # correct token + operator.admin scopes — so Workspace + Build hang on
    # "pairing required: device is not approved yet". This drains pending pairing
    # requests every 5s so the backend's handshake succeeds unattended; it is an
    # idempotent no-op once the device is paired ("No pending requests", exit 0).
    # Safe here: openclaw has NO external port (internal network + 127.0.0.1 only),
    # so only Harvis's own services / local Cursor can ever create a pending
    # request. `$$` = a literal `$` (expanded container-side, not by Compose).
    command:
      - sh
      - -c
      - |
        ( while true; do
            openclaw devices approve --latest --url ws://127.0.0.1:18789 \
              --token "$$OPENCLAW_GATEWAY_TOKEN" >/dev/null 2>&1 || true
            sleep 5
          done ) &
        exec openclaw gateway --bind lan --port 18789 --allow-unconfigured
    depends_on:
      pgsql:
        condition: service_healthy
      openclaw-db-init:
        condition: service_completed_successfully
      # The bundled ollama + ollama-model-check are gone: the model server is the
      # operator's now (HARVIS_LLM_BASE_URL), so there is nothing local to wait on.
      # OpenClaw resolves its model endpoint per request and reports a provider
      # that isn't answering, rather than refusing to boot without one.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const n=require('net');const c=n.createConnection(18789,'127.0.0.1');c.on('connect',()=>{c.end();process.exit(0)});c.on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
    networks:
      - openclaw-internal
      - ollama-n8n-network

  # ═══════════════════════════════════════════════════════════════════════════
  # Open Notebook Services
  # ═══════════════════════════════════════════════════════════════════════════

  # `notebooks-upstream`, NOT `notebooks`: this pair is the official lfnovo app on
  # its own SurrealDB — a separate product from the Harvis notebooks lane
  # (open-notebook-ui + document-worker), which nginx routes /onb to and which
  # never reads this database. Sharing one profile meant `--profile notebooks up`
  # pulled 2.67 GB of images the Harvis UI does not use, and made the pack look
  # 2.6x more expensive than it is. Nothing in the Harvis lane depends on either
  # service, so the split is inert for it.
  surrealdb:
    image: surrealdb/surrealdb:v2@sha256:d653f6c8a89e81f865ee31cd2f587c50f50ace922175e04150b1e385d2f86011
    container_name: ${HARVIS_CONTAINER_PREFIX:-}surrealdb
    profiles: ["notebooks-upstream"]
    restart: unless-stopped
    command: start --log info --user root --pass root rocksdb:/mydata/mydatabase.db
    environment:
      - SURREAL_EXPERIMENTAL_GRAPHQL=true
    volumes:
      - surrealdb_data:/mydata
    user: root
    networks:
      - ollama-n8n-network

  open-notebook:
    # Reaches an LLM server running on the HOST (the default is the operator's
    # own Ollama/LM Studio/llama.cpp/vLLM on 127.0.0.1). Linux needs this
    # mapping explicitly; without it host.docker.internal does not resolve.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # v1-latest is a moving tag — same class of problem as :latest, one major
    # version narrower. Digest-pinned; the tag stays in the name for readability.
    image: lfnovo/open_notebook:v1-latest@sha256:65e10ee94f8ce5a9e4e1db9a17316246960b236b6278edf75a965be52e9e882c
    container_name: ${HARVIS_CONTAINER_PREFIX:-}open-notebook
    # See the surrealdb note above — upstream lane, opt in separately.
    profiles: ["notebooks-upstream"]
    restart: unless-stopped
    ports:
      # Notebook UI + its API. Reached through nginx, not directly.
      - "${HARVIS_BIND_ADDR:-127.0.0.1}:${HARVIS_PORT_NOTEBOOK_UI:-8502}:8502"
      - "${HARVIS_BIND_ADDR:-127.0.0.1}:${HARVIS_PORT_NOTEBOOK_API:-5055}:5055"
    environment:
      # SurrealDB Configuration
      SURREAL_URL: ws://surrealdb:8000/rpc
      SURREAL_USER: root
      SURREAL_PASSWORD: root
      SURREAL_NAMESPACE: open_notebook
      SURREAL_DATABASE: open_notebook
      # Ollama Configuration (shared with your backend)
      OLLAMA_API_BASE: "${HARVIS_LLM_BASE_URL:-${OLLAMA_URL:-http://host.docker.internal:11434}}"
      # API Configuration
      API_URL: http://localhost:8502
      INTERNAL_API_URL: http://localhost:5055
      API_CLIENT_TIMEOUT: "300"
    volumes:
      - open_notebook_data:/app/data
    depends_on:
      - surrealdb
    # Must share a network with surrealdb and ollama — both are pinned to
    # ollama-n8n-network. With no `networks:` key Compose silently placed this
    # service on the project default instead, so `ws://surrealdb:8000/rpc` never
    # resolved: the startup migrations died with "[Errno -3] Temporary failure in
    # name resolution" and supervisord restarted the api process forever.
    networks:
      - ollama-n8n-network

  # MCP bridge for Cursor / VS Code integration
  harvis-mcp:
    # Same context and same args as `backend`, so this resolves to the SAME image
    # on disk under a second name — not a second 2.42 GB copy. Leaving this one on
    # the torch Dockerfile is what made a CPU install (17.8 GB) end up LARGER than
    # a GPU install (15.4 GB shared).
    build:
      context: ./python_back_end
      dockerfile: Dockerfile.core
      args:
        # Stamped into org.opencontainers.image.revision. Unset locally, so a
        # developer build is honestly labelled "unknown" rather than carrying a
        # stale sha; CI exports HARVIS_VCS_REF and gets the real one.
        VCS_REF: ${HARVIS_VCS_REF:-unknown}
    container_name: ${HARVIS_CONTAINER_PREFIX:-}harvis-mcp
    restart: unless-stopped
    entrypoint: ["uvicorn", "mcp.server.app:app", "--host", "0.0.0.0", "--port", "8010"]
    environment:
      BACKEND_INTERNAL_URL: "http://backend:8000"
      OPENCLAW_GATEWAY_TOKEN: "${OPENCLAW_GATEWAY_TOKEN_BUNDLED:-${OPENCLAW_GATEWAY_TOKEN}}"
      PYTHONPATH: "/app"
    depends_on:
      backend:
        condition: service_started
    networks:
      - ollama-n8n-network
      - openclaw-internal
    ports:
      - "127.0.0.1:${HARVIS_PORT_MCP:-8010}:8010"

  # ═══════════════════════════════════════════════════════════════════════════
  # TTS Service - Voice Cloning & Podcast Generation  (ADVANCED VOICE)
  # ───────────────────────────────────────────────────────────────────────────
  # A 20 GB image carrying its own PyTorch, CUDA and the RVC voice-conversion
  # stack. That is the entire reason it is NOT in the `voice` profile: the
  # recommended Voice-First install is meant to be torch-free, and a profile
  # that quietly pulls this in would have made "no PyTorch by default" a claim
  # rather than a fact. Start it deliberately:
  #     docker compose --profile advanced-voice up -d
  # ═══════════════════════════════════════════════════════════════════════════

  tts-service:
    build:
      context: .
      dockerfile: docker/tts-service/Dockerfile
    container_name: ${HARVIS_CONTAINER_PREFIX:-}tts-service
    profiles: ["advanced-voice"]
    restart: unless-stopped
    ports:
      # TTS. Called by the backend as http://tts-service:8001.
      - "${HARVIS_BIND_ADDR:-127.0.0.1}:${HARVIS_PORT_TTS:-8001}:8001"
    environment:
      # TTS Configuration
      TTS_HOST: "0.0.0.0"
      TTS_PORT: "8001"
      QUANTIZE_4BIT: "true"
      # Force GPU mode for RTX 50 series (sm_120) with PyTorch nightly
      TTS_FORCE_GPU: "true"
      # Enable Dia for voice cloning (uses GPU)
      TTS_ENABLE_DIA: "true"
      # Storage paths (inside container)
      VOICES_DIR: /app/voices
      OUTPUT_DIR: /app/output
      MODEL_CACHE_DIR: /app/models
      # RVC Configuration
      RVC_MODELS_DIR: /app/rvc_models
      RVC_ASSETS_DIR: /app/assets
      RVC_MAX_CACHED_MODELS: "4"
    volumes:
      - tts_voices:/app/voices
      - tts_output:/app/output
      - tts_models:/app/models
      - tts_rvc_models:/app/rvc_models
      - tts_rvc_assets:/app/assets
      - ./python_back_end/tts_system:/app/tts_system:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - ollama-n8n-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ═══════════════════════════════════════════════════════════════════════════
  # voice-onnx — the DEFAULT speech service for a voice-first install
  # ───────────────────────────────────────────────────────────────────────────
  # Local speech recognition, voice activity detection and Kokoro synthesis, all
  # on ONNX Runtime through sherpa-onnx. No PyTorch, no CUDA — the image asserts
  # that at build time. This is what makes a voice-capable Harvis fit on a
  # laptop: ~1 GB of image against the 15.4 GB GPU backend.
  #
  # Built here rather than pulled: the alternative was an unvetted community
  # image, and this one is small enough to own.
  #
  # In the DEFAULT set, not behind a profile. It used to sit behind
  # `profiles: ["voice"]`, which meant a plain `up -d` started no speech service
  # at all — and once the backend moved to the torch-free Dockerfile.core, the
  # in-process fallback it was hiding behind stopped existing too. The backend's
  # HARVIS_STT_URL / HARVIS_TTS_URL default straight here.
  #
  # Models are NOT in the image. On first use it downloads whisper-tiny.en,
  # silero VAD and Kokoro v1.0 (~630 MB total) into the voice-models volume,
  # where they survive rebuilds. Set VOICE_ASR_MODEL / VOICE_TTS_MODEL to pick
  # different bundles; `docker compose run --rm voice-onnx download-models`
  # fetches them ahead of the first request.
  #
  # No `ports:` — reachable from the backend over the compose network only.
  # ═══════════════════════════════════════════════════════════════════════════

  voice-onnx:
    build:
      context: ./services/voice-onnx
      dockerfile: Dockerfile
      args:
        # Stamped into org.opencontainers.image.revision. Unset locally, so a
        # developer build is honestly labelled "unknown" rather than carrying a
        # stale sha; CI exports HARVIS_VCS_REF and gets the real one.
        VCS_REF: ${HARVIS_VCS_REF:-unknown}
    image: harvis-voice-onnx:local
    pull_policy: build
    container_name: ${HARVIS_CONTAINER_PREFIX:-}harvis-voice-onnx
    restart: unless-stopped
    environment:
      VOICE_ASR_MODEL: "${VOICE_ASR_MODEL:-whisper-tiny.en}"
      VOICE_TTS_MODEL: "${VOICE_TTS_MODEL:-kokoro-v1.0}"
      VOICE_TTS_VOICE: "${VOICE_TTS_VOICE:-af_heart}"
      VOICE_ASR_LANGUAGE: "${VOICE_ASR_LANGUAGE:-en}"
      VOICE_NUM_THREADS: "${VOICE_NUM_THREADS:-2}"
      VOICE_API_KEY: "${VOICE_API_KEY:-}"
      # Pull the SERVER-side bundles at startup instead of on the first request.
      # The image ships no weights, so without this the first click of a speaker
      # icon on a fresh install waited ~36 s for 384 MB of Kokoro — inside a
      # 120 s backend timeout, so a slow link failed outright. Set to 0 for an
      # air-gapped box that pre-seeds the volume by hand, or to a subset like
      # "tts,vad" to skip the ASR bundle.
      VOICE_PREFETCH: "${VOICE_PREFETCH:-1}"
      # Mirror of the Kokoro model the BROWSER loads (nginx serves it at
      # /kokoro/), so in-tab speech survives losing internet. Syncs in the
      # background on startup; ~120 MB for the default q8 build. Add fp32 if
      # your users have WebGPU and you want that offline too (+325 MB).
      VOICE_BROWSER_ASSETS: "${VOICE_BROWSER_ASSETS:-1}"
      VOICE_BROWSER_DTYPES: "${VOICE_BROWSER_DTYPES:-q8}"
    volumes:
      # Pre-created and owned by uid 1001 in the image, so a fresh volume
      # inherits that ownership instead of coming up root-owned.
      - voice-models:/models
    networks:
      - ollama-n8n-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 2G

  # ═══════════════════════════════════════════════════════════════════════════
  # STT Sidecar — speech-to-text off the backend process (FALLBACK)
  # ───────────────────────────────────────────────────────────────────────────
  # Kept as the reference the ONNX benchmark measures against, and the way back
  # if ONNX falls short. It has its own profile now that voice-onnx passes the
  # acceptance run, so `--profile voice` no longer pulls a second, larger STT
  # image just to have a fallback nobody asked for.
  #
  # Somewhere to point HARVIS_STT_PROVIDER=sidecar. Speaches (the maintained
  # successor to faster-whisper-server) serves the same OpenAI-compatible
  # /v1/audio/transcriptions contract python_back_end/transcription.py speaks, so
  # the backend needs no in-process Whisper — and therefore no torch — to accept
  # a microphone recording.
  #
  # Opt-in via the `voice-fallback` profile, and no `ports:` — reachable from
  # the backend over the compose network, not from the host. To use it:
  #     COMPOSE_PROFILES=voice-fallback
  #     HARVIS_STT_PROVIDER=sidecar
  #     HARVIS_STT_URL=http://stt:8000/v1
  # The default tag is the CPU build; on a GPU box set
  # HARVIS_STT_IMAGE=ghcr.io/speaches-ai/speaches:latest-cuda and add the nvidia
  # runtime + device reservation the way tts-service does above.
  # ═══════════════════════════════════════════════════════════════════════════

  stt:
    # Default pinned by digest (upstream tags only the Ubuntu base version, not
    # the app). HARVIS_STT_IMAGE still overrides it for anyone tracking latest.
    image: "${HARVIS_STT_IMAGE:-ghcr.io/speaches-ai/speaches:latest-cpu@sha256:21e3df06d842fb7802ab470dd77c25f0e8c0d22950e8d8c6ae886e851af53ef8}"
    container_name: ${HARVIS_CONTAINER_PREFIX:-}harvis-stt
    profiles: ["voice-fallback"]
    restart: unless-stopped
    environment:
      WHISPER__TTL: "${HARVIS_STT_TTL:-300}"
    volumes:
      # Its OWN cache, mounted at the image's default HF cache path.
      #
      # Two things force this. (1) It can't share ml-models-cache: this image
      # runs as uid 1000 (ubuntu) while the rest of the stack runs as 1001
      # (appuser), so the shared volume is read-only to it — it comes up healthy
      # and then fails on the first transcription, when it tries to download a
      # model. (2) The mount point must already exist in the image, because
      # Docker copies ownership into a fresh named volume only from a directory
      # that's there; mounting at an invented path like /models-cache gets a
      # root-owned volume and the same permission failure.
      #
      # Nothing is lost by splitting: the backend's Whisper models are
      # openai-whisper .pt files under ~/.cache/whisper, a different format from
      # the CTranslate2/HF snapshots this service fetches.
      - stt-cache:/home/ubuntu/.cache/huggingface
    networks:
      - ollama-n8n-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ═══════════════════════════════════════════════════════════════════════════
  # Messaging Gateway Sidecar (Phase 1B)
  # ───────────────────────────────────────────────────────────────────────────
  # Bridges third-party messaging platforms (Slack, Discord, Telegram, Email,
  # SMS) to the Harvis backend. Runs on ollama-n8n-network ONLY — needs
  # outbound internet for platform APIs. NEVER joins openclaw-internal.
  #
  # Phase 1B ships only the stub adapter (HTTP inject endpoint at :18800,
  # bound to 127.0.0.1, gated by STUB_ENABLED=true). Real platform adapters
  # land in Phase 1C (Slack) and Phase 1D (Discord).
  # ═══════════════════════════════════════════════════════════════════════════

  harvis-messaging-gateway:
    build:
      context: ./plugins/messaging-gateway
      dockerfile: Dockerfile
    image: harvis-messaging-gateway:local
    pull_policy: build
    container_name: ${HARVIS_CONTAINER_PREFIX:-}harvis-messaging-gateway
    # Opt-in. The crash loop that first motivated a profile here is fixed — with
    # no adapters enabled the gateway idles rather than exiting — but idling
    # still costs a 294 MB image, a running container and a bound host port on
    # every default install, for Slack/Discord bridges nobody has configured.
    # Enable with COMPOSE_PROFILES=messaging (the backend reads the same var as
    # HARVIS_ENABLED_PROFILES, so its health endpoints stay in agreement).
    profiles: ["messaging"]
    restart: unless-stopped
    environment:
      MESSAGING_GATEWAY_TOKEN: "${MESSAGING_GATEWAY_TOKEN:-}"
      HARVIS_BACKEND_URL: "http://backend:8000"
      ENABLED_PLATFORMS: "${MESSAGING_ENABLED_PLATFORMS:-stub}"
      RUN_POLL_INTERVAL_S: "${MESSAGING_RUN_POLL_INTERVAL_S:-2}"
      RUN_POLL_TIMEOUT_S: "${MESSAGING_RUN_POLL_TIMEOUT_S:-1200}"
      # Stub adapter (dev/test only — never enable in prod)
      STUB_ENABLED: "${MESSAGING_STUB_ENABLED:-false}"
      STUB_PORT: "18800"
      STUB_TOKEN: "${MESSAGING_STUB_TOKEN:-}"
      # Slack (Phase 1C)
      SLACK_BOT_TOKEN: "${SLACK_BOT_TOKEN:-}"
      SLACK_SIGNING_SECRET: "${SLACK_SIGNING_SECRET:-}"
      SLACK_APP_TOKEN: "${SLACK_APP_TOKEN:-}"
      # Discord (Phase 1D — same env vars as the legacy workspace bot, so
      # cutover doesn't require re-issuing tokens)
      DISCORD_BOT_TOKEN: "${DISCORD_BOT_TOKEN:-}"
      DISCORD_DEFAULT_USER_ID: "${DISCORD_DEFAULT_USER_ID:-0}"
      DISCORD_MENTION_ONLY: "${DISCORD_MENTION_ONLY:-true}"
      DISCORD_ALLOWED_CHANNEL_IDS: "${DISCORD_ALLOWED_CHANNEL_IDS:-}"
    volumes:
      - ./plugins/messaging-gateway:/app:ro
    # Stub inject port — bound to localhost so only operators on the host
    # can drive E2E tests. Comment out for prod deploys.
    ports:
      - "127.0.0.1:${HARVIS_PORT_MESSAGING:-18800}:18800"
    depends_on:
      backend:
        condition: service_started
    networks:
      - ollama-n8n-network

  # ── Harvis OpenCode engine sidecar (Phase E1 — external code engine) ──
  # An external coding CLI the VibeCode/Build runtime can drive: the backend
  # `docker exec`s `opencode run` here against the session clone (shared via the
  # artifact_data volume, same path) using a LOCAL Ollama model — zero cloud
  # credentials. Idle by default (invoked per-turn); gated on the backend by
  # HARVIS_OWUI_EXTERNAL_ENGINES. No host ports. uid 1001 = artifact_data owner.
  opencode:
    # Reaches an LLM server running on the HOST (the default is the operator's
    # own Ollama/LM Studio/llama.cpp/vLLM on 127.0.0.1). Linux needs this
    # mapping explicitly; without it host.docker.internal does not resolve.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: ./opencode
      dockerfile: Dockerfile
    image: harvis-opencode:local
    pull_policy: build
    container_name: ${HARVIS_CONTAINER_PREFIX:-}harvis-opencode
    profiles: ["engines"]
    restart: unless-stopped
    user: "1001:1001"
    environment:
      OLLAMA_URL: "${HARVIS_LLM_BASE_URL:-${OLLAMA_URL:-http://host.docker.internal:11434}}"
      HOME: /home/opencode
    volumes:
      - artifact_data:/data/artifacts
    networks:
      - ollama-n8n-network

  # ── Harvis Codex engine sidecar (Phase E2 — cloud, per-user OpenAI key) ──
  # Runs OpenAI's Codex CLI against the session clone. The user's OpenAI key is
  # injected per-exec at run time (docker exec -e OPENAI_API_KEY=…) — NOT baked here.
  # Talks to api.openai.com over the bridge network. Gated by HARVIS_OWUI_EXTERNAL_ENGINES.
  codex:
    build:
      context: ./codex
      dockerfile: Dockerfile
    image: harvis-codex:local
    pull_policy: build
    container_name: ${HARVIS_CONTAINER_PREFIX:-}harvis-codex
    profiles: ["engines"]
    restart: unless-stopped
    user: "1001:1001"
    environment:
      HOME: /home/codex
    volumes:
      - artifact_data:/data/artifacts
      # Published skills (Engine sync) — read-only; the backend owns writes.
      - ./openclaw/skills/${OPENCLAW_CONFIG_SET:-bundled}:/skills:ro
    networks:
      - ollama-n8n-network

  # ── Harvis Claude Code engine sidecar (Phase E2 — cloud, per-user Anthropic key) ──
  # Runs Anthropic's Claude Code CLI against the session clone. The user's Anthropic
  # key is injected per-exec at run time (docker exec -e ANTHROPIC_API_KEY=…) — NOT
  # baked here. Talks to api.anthropic.com over the bridge network. Same flag gate.
  claude-code:
    build:
      context: ./claude-code
      dockerfile: Dockerfile
    image: harvis-claude-code:local
    pull_policy: build
    container_name: ${HARVIS_CONTAINER_PREFIX:-}harvis-claude-code
    profiles: ["engines"]
    restart: unless-stopped
    user: "1001:1001"
    environment:
      HOME: /home/claude
      CLAUDE_CODE_SIMPLE: "1"
    volumes:
      - artifact_data:/data/artifacts
      # Published skills (Engine sync) — read-only; the backend owns writes.
      - ./openclaw/skills/${OPENCLAW_CONFIG_SET:-bundled}:/skills:ro
    networks:
      - ollama-n8n-network

  # ── Harvis Hermes Agent engine sidecar (Phase E4B — the REAL NousResearch Hermes app) ──
  # Thin wrapper FROM the official image. Runs as ROOT (the gateway is s6-supervised and
  # requires root) and serves the OpenAI-compatible API server on :8642 (Chat) on the
  # INTERNAL network only — no host port. Build runs are driven by the backend via
  # `docker exec -u 1001 hermes -z` against a session clone (files land 1001-owned so the
  # backend can diff them). Local Ollama only — NO provider/API key baked.
  hermes-agent:
    # Reaches an LLM server running on the HOST (the default is the operator's
    # own Ollama/LM Studio/llama.cpp/vLLM on 127.0.0.1). Linux needs this
    # mapping explicitly; without it host.docker.internal does not resolve.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: ./hermes-agent
      dockerfile: Dockerfile
    image: harvis-hermes-agent:local
    pull_policy: build
    container_name: ${HARVIS_CONTAINER_PREFIX:-}harvis-hermes-agent
    profiles: ["engines"]
    restart: unless-stopped
    environment:
      HERMES_HOME: /opt/data
      API_SERVER_ENABLED: "${HARVIS_HERMES_API_SERVER_ENABLED:-true}"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8642"
      # v0.17 REQUIRES a key to start the API server (even internal/loopback). Internal
      # network only (no host port); this is a local gateway bearer token, NOT a user/
      # cloud credential. Override in prod. The backend Chat connector uses the same value.
      API_SERVER_KEY: "${HARVIS_HERMES_API_SERVER_KEY:-harvis-hermes-local-dev}"
      HARVIS_HERMES_OLLAMA_URL: "${HARVIS_HERMES_OLLAMA_URL:-${HARVIS_LLM_BASE_URL:-${OLLAMA_URL:-http://host.docker.internal:11434}}/v1}"
      HARVIS_HERMES_AGENT_DEFAULT_MODEL: "${HARVIS_HERMES_AGENT_DEFAULT_MODEL:-qwen3:4b}"
    volumes:
      - artifact_data:/data/artifacts       # session clones (Build) — shared with the backend
      - hermes_gateway_home:/opt/data       # gateway (Chat) profile/config/memory
      - hermes_homes:/data/hermes-homes     # per-user Build profiles (HERMES_HOME per run)
      # Published skills (Engine sync) — read-only; the backend owns writes.
      - ./openclaw/skills/${OPENCLAW_CONFIG_SET:-bundled}:/skills:ro
    networks:
      - ollama-n8n-network

  # Adaptive Workspace CAD engine (Stage 2) — isolated build123d/OCP kernel.
  # Kept out of the torch backend image so its numpy-2 / OCP stack can't conflict
  # with the backend's numpy<2 / torch pins. Internal network only, no host port.
  cad-engine:
    build:
      context: ./cad-engine
      dockerfile: Dockerfile
    image: harvis-cad:local
    pull_policy: build
    container_name: ${HARVIS_CONTAINER_PREFIX:-}harvis-cad
    profiles: ["cad"]
    restart: unless-stopped
    # Dedicated INTERNAL network shared only with the backend. The sidecar has no
    # auth and no host port; keeping it off the shared ollama-n8n-network means the
    # internet-capable / prompt-injectable OpenClaw pod cannot reach it laterally.
    # Precisely: `internal: true` blocks EXTERNAL egress. Sibling containers on
    # cad-internal can still reach it, so the safety here rests on having no secret,
    # no docker socket and no bind mount — not on being unreachable.
    networks:
      - cad-internal
    environment:
      # Gate 1B. The deadline is the INNERMOST of three: it must stay below
      # fab_cad's httpx timeout (30 s), which stays below nginx's. deadline + grace
      # = 23 s worst case. Raising it past 27 s makes the client give up first,
      # which is the exact dishonesty Gate 1B removed.
      CAD_BUILD_DEADLINE_S: "${CAD_BUILD_DEADLINE_S:-20}"
      CAD_BUILD_GRACE_S: "${CAD_BUILD_GRACE_S:-3}"
      # 2 × the measured ~460 MiB peak sits under mem_limit with room for the
      # parent, and the container only has 2.0 CPUs. Gate 2's brick benchmark is
      # what should revisit this, not a guess.
      CAD_MAX_CONCURRENT_BUILDS: "${CAD_MAX_CONCURRENT_BUILDS:-2}"
    # Resource limits, top-level and NOT under `deploy:` — this is plain Compose,
    # where `deploy.resources` is silently ignored outside Swarm. Verify what the
    # daemon actually applied, never the YAML:
    #   docker inspect harvis-cad --format '{{json .HostConfig}}'
    # Baseline before this block existed: Memory 0, NanoCpus 0, PidsLimit null,
    # ReadonlyRootfs false, CapDrop null, SecurityOpt null — nothing at all.
    user: "1001:1001"
    read_only: true
    tmpfs:
      # Geometry scratch. noexec because nothing in a CAD build has any business
      # being executed out of the scratch dir.
      - /tmp:rw,noexec,nosuid,nodev,size=512m,mode=1777
      # ezdxf (pulled in by build123d) writes a font cache at import time and logs a
      # warning on every start without it. Small, throwaway, and it keeps the rootfs
      # read-only rather than trading isolation for a quiet log.
      - /home/appuser/.cache:rw,noexec,nosuid,nodev,size=32m,uid=1001,gid=1001
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    # Measured peak RSS is ~387 MiB for the worst request the clamps permit, so 2g is
    # deliberate headroom rather than a tight fit. Note what this does NOT solve: the
    # known runaway is CPU-bound with flat memory, so mem_limit never fires on it.
    # Since Gate 1B that runaway is bounded by CAD_BUILD_DEADLINE_S above instead.
    mem_limit: 2g
    cpus: 2.0
    stop_grace_period: 10s

  # Agent Reach (optional) — Phase 1 tools run IN the Harvis backend
  # (agent_reach package) when HARVIS_AGENT_REACH_ENABLED=1.
  # This profile is a placeholder for a future exec sandbox with controlled egress.
  # NEVER attach this to the OpenClaw pod / never widen OpenClaw NetworkPolicy.
  agent-reach-sandbox:
    image: curlimages/curl:8.5.0
    container_name: ${HARVIS_CONTAINER_PREFIX:-}harvis-agent-reach-sandbox
    profiles: ["agent-reach"]
    restart: "no"
    command: ["sleep", "infinity"]
    networks:
      - ollama-n8n-network
    # No ports. Backend talks to public APIs itself; this sandbox is for later
    # CLI experiments under operator control only.

  # SentrySearch (optional video MCP) — local video search over a user volume.
  # Profile-gated (~450–600 MB). Default OFF. Not security/CVE search.
  # Do NOT use the upstream OpenClaw skill path (needs Gemini + egress).
  sentrysearch-mcp:
    build:
      context: ./mcp-servers/sentrysearch
      dockerfile: Dockerfile
    image: harvis-sentrysearch:local
    pull_policy: build
    container_name: ${HARVIS_CONTAINER_PREFIX:-}harvis-sentrysearch
    profiles: ["sentrysearch"]
    restart: unless-stopped
    environment:
      SENTRYSEARCH_VIDEO_DIR: /data/videos
      SENTRYSEARCH_EMBED_BACKEND: "${SENTRYSEARCH_EMBED_BACKEND:-local}"
    volumes:
      - sentrysearch_videos:/data/videos
    networks:
      - ollama-n8n-network
    # No host ports — MCP stdio/runtime only when explicitly enabled.

networks:
  ollama-n8n-network:
    external: true
  openclaw-internal:
    driver: bridge
    internal: true
  cad-internal:
    driver: bridge
    internal: true
  # Repo Runner sandbox network — NOT internal:true (untrusted repo code needs the
  # internet for npm/uv installs). No Harvis service is attached, so the sandbox can't
  # reach pgsql/ollama/openclaw; the backend is dual-homed only to run the readiness
  # probe. The live preview is a docker-published 127.0.0.1 host port hit directly.
  repo-sandbox:
    driver: bridge
  # Preview rendering network. internal:true is load-bearing, not decoration:
  # preview-runner opens untrusted HTML, and this is the outer fence behind the
  # browser's own no-JS/no-network profile. Only the backend is attached.
  preview-net:
    driver: bridge
    internal: true

volumes:
  pgsql_data:
  ml-models-cache:
  stt-cache:            # `voice` profile: the STT sidecar's HF cache (uid 1000, not 1001)
  voice-models:         # voice-onnx's ASR/VAD/Kokoro bundles, ~630 MB (uid 1001)
  embedding-data:
  artifact_data:
  surrealdb_data:
  open_notebook_data:
  tts_voices:
  tts_output:
  tts_models:
  tts_rvc_models:
  tts_rvc_assets:
  openclaw-data:
  openclaw-projects:
  ssh_state:             # Phase 4: per-user SSH known_hosts + ephemeral key temp files (0700)
  hermes_gateway_home:   # Phase E4B: Hermes Agent gateway (Chat) profile/config/memory
  hermes_homes:          # Phase E4B: per-user Hermes Build profiles (HERMES_HOME per run)
  sentrysearch_videos:   # Optional SentrySearch profile — local user video volume only
  agent-browser-profiles:  # Agent Teammates: one Firefox profile per teammate (browser-runner only)
